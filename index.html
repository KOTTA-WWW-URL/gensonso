<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gensonso</title>
    <meta property="og:title" content="Gensonso" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="元素の勉強に使ってください。" />
    <meta property="og:site_name" content="Gensonso" />
    
    <style>
        :root {
            --key-bg: #ffffff;
            --bg-color: #d1d4d9;
            --special-key-bg: #adb5bd;
            --active-bg: #a0a0a0;
            --shift-bg: #ffc107;
            --disabled-key-bg: #e8e8e8;
            --disabled-key-color: #bbb;

            --key-height: 48px;
            --key-font: 16px;
            --key-mb: 7px;
            --kbd-padding: 9px;
            --num-row-height: 40px;
            --num-row-font: 13px;
            /* 5 rows: num row + 4 alpha rows */
            --keyboard-total: calc(var(--num-row-height) + var(--key-height) * 4 + var(--key-mb) * 5 + var(--kbd-padding) * 2);
        }

        @media (max-height: 600px) {
            :root {
                --key-height: 34px;
                --key-font: 12px;
                --key-mb: 4px;
                --kbd-padding: 5px;
                --num-row-height: 30px;
                --num-row-font: 11px;
            }
        }
        @media (max-height: 700px) and (min-height: 601px) {
            :root {
                --key-height: 40px;
                --key-font: 14px;
                --key-mb: 5px;
                --kbd-padding: 7px;
                --num-row-height: 34px;
                --num-row-font: 12px;
            }
        }
        @media (max-width: 360px) {
            :root {
                --key-font: 11px;
                --num-row-font: 10px;
            }
        }

        * {
            touch-action: manipulation;
            box-sizing: border-box;
        }
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
            padding: 16px; overflow-y: auto;
        }
        .active-screen { display: flex; }

        .menu-btn {
            padding: 15px 30px; margin: 8px; font-size: clamp(14px, 4vw, 18px);
            cursor: pointer; border: none; background: #007bff; color: white; border-radius: 8px;
            min-width: min(280px, 85vw); transition: 0.2s;
        }

        #admin-trigger {
            position: absolute; bottom: 20px; right: 20px;
            padding: 8px 15px; background: #6c757d; color: white;
            border-radius: 5px; cursor: pointer; font-size: 12px; border: none; opacity: 0.6;
        }
        #admin-screen {
            background: #1e1e1e; color: #00ff00; font-family: monospace;
            padding: 20px; box-sizing: border-box;
        }
        #admin-console {
            width: 95%; height: 60%; background: #000; color: #00ff00;
            padding: 10px; overflow-y: auto; border: 1px solid #333;
            margin-bottom: 10px; font-size: 14px; white-space: pre-wrap;
        }
        #admin-input {
            width: 95%; background: #000; color: #00ff00;
            border: 1px solid #00ff00; padding: 10px;
            font-family: monospace; outline: none;
        }

        #message-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; background: rgba(255,255,255,0.95);
            overflow-y: auto; padding: 10px 16px;
        }
        #message-content {
            font-size: clamp(32px, 10vw, 70px); font-weight: bold;
        }
        #message-sub {
            font-size: clamp(13px, 3.5vw, 22px);
            color: #333; margin: 8px 0; text-align: center; padding: 0 8px;
        }

        #gacha-result { text-align: center; margin-top: 8px; display: none; }
        #gacha-img {
            max-width: min(220px, 42vw); max-height: 22vh;
            width: auto; height: auto;
            border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #gacha-prob {
            margin-top: 6px; font-weight: bold; color: #666;
            font-size: clamp(11px, 3vw, 15px);
        }

        #game-container {
            position: fixed; top: 0; left: 0; width: 100%;
            height: calc(100% - var(--keyboard-total));
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 8px 16px; overflow-y: auto;
        }
        #mondai-display {
            font-size: clamp(14px, 4vw, 22px); margin-bottom: 12px; color: #555;
        }
        #answer-area {
            font-size: clamp(18px, 5vw, 28px); font-weight: bold;
            display: flex; flex-wrap: wrap;
            justify-content: center; gap: 8px; align-items: center;
        }
        .input-box {
            border-bottom: 3px solid #ccc;
            min-width: clamp(50px, 15vw, 80px);
            height: clamp(30px, 8vw, 40px);
            display: flex; align-items: center; justify-content: center;
            padding: 0 5px;
        }
        .input-box.active-box { border-bottom-color: #007bff; color: #007bff; }
        .cursor {
            width: 2px; height: clamp(18px, 5vw, 24px);
            background-color: #007bff; animation: blink 0.8s infinite; margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ===== KEYBOARD ===== */
        .keyboard {
            position: fixed; bottom: 0; width: 100%;
            background-color: var(--bg-color);
            padding: var(--kbd-padding) 0;
            display: none;
            padding-bottom: calc(var(--kbd-padding) + env(safe-area-inset-bottom, 0px));
        }
        .row {
            display: flex; justify-content: center; margin-bottom: var(--key-mb);
        }
        .row:last-child { margin-bottom: 0; }

        /* Normal keys */
        .key {
            flex: 1; margin: 0 2px;
            background-color: var(--key-bg);
            border: none; border-radius: 5px;
            font-size: var(--key-font);
            cursor: pointer;
            box-shadow: 0 3px 0 #999;
            transition: transform 0.08s, box-shadow 0.08s, background-color 0.1s;
            touch-action: manipulation;
            user-select: none; -webkit-user-select: none;
            min-width: 0; padding: 0 1px;
            color: #222;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 1px;
            height: var(--key-height);
        }
        /* Number row keys are shorter */
        .key-num {
            height: var(--num-row-height);
            font-size: var(--num-row-font);
        }
        .key.active {
            background-color: var(--active-bg) !important;
            box-shadow: 0 1px 0 #999;
            transform: translateY(2px);
        }
        .key.key-disabled {
            background-color: var(--disabled-key-bg);
            color: var(--disabled-key-color);
            cursor: not-allowed;
            box-shadow: 0 2px 0 #ccc;
            pointer-events: none;
        }
        .key-special { background-color: var(--special-key-bg); flex: 1.5; }
        .key-wide { flex: 2; }
        .key-space { flex: 4; }
        .key.shift-active {
            background-color: var(--shift-bg) !important;
            color: #222; font-weight: bold;
        }

        /* Sub-label */
        .key-main { line-height: 1; }
        .key-sub {
            font-size: 0.6em; color: #888; line-height: 1;
        }
        .key.shift-active .key-sub { color: #555; }

        .key-num .key-main { font-size: 1em; }
        .key-num .key-sub  { font-size: 0.65em; color: #999; }

        /* ===== ALL END ===== */
        #allend-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column;
            align-items: center; justify-content: flex-start;
            z-index: 60; background: white;
            padding: 24px 16px 32px; overflow-y: auto;
        }
        #allend-title {
            font-size: clamp(40px, 12vw, 80px);
            font-weight: bold; letter-spacing: 4px; color: #222; margin-top: 20px;
        }
        #allend-score { font-size: clamp(18px, 5vw, 32px); color: #555; margin: 16px 0; }
        #allend-back {
            padding: clamp(10px, 3vw, 15px) clamp(20px, 6vw, 40px);
            font-size: clamp(16px, 4vw, 20px);
            background: #007bff; color: white;
            border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;
        }
        #wrong-list-section { width: 100%; max-width: 600px; margin-top: 24px; text-align: left; }
        #wrong-list-title {
            font-size: clamp(16px, 4.5vw, 22px); font-weight: bold; color: #c0392b;
            margin-bottom: 12px; border-left: 5px solid #c0392b; padding-left: 10px;
        }
        .wrong-item {
            background: #fff5f5; border: 1px solid #f5c6cb;
            border-radius: 8px; padding: 10px 14px; margin-bottom: 10px;
        }
        .wrong-item .wi-mondai { font-size: clamp(12px, 3.2vw, 15px); color: #777; margin-bottom: 4px; }
        .wrong-item .wi-answer { font-size: clamp(13px, 3.5vw, 17px); font-weight: bold; color: #222; }
        .wrong-item .wi-answer span {
            background: #ffe0e0; border-radius: 4px; padding: 1px 5px; color: #c0392b;
        }

        /* 変換候補パネル */
        #henkan-panel {
            position: fixed;
            bottom: var(--keyboard-total);
            left: 0; width: 100%;
            background: #fff;
            border-top: 2px solid #007bff;
            display: none;
            flex-wrap: wrap;
            z-index: 20;
            max-height: 44px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
        }
        .henkan-item {
            display: inline-block;
            padding: 8px 14px;
            font-size: 16px;
            cursor: pointer;
            border-right: 1px solid #ddd;
            flex-shrink: 0;
        }
        .henkan-item:active, .henkan-item.selected {
            background: #007bff;
            color: white;
        }

        /* Shift mode indicator banner */
        #shift-banner {
            position: fixed;
            top: calc(100% - var(--keyboard-total) - 28px);
            left: 0; width: 100%; text-align: center;
            font-size: 12px; font-weight: bold; letter-spacing: 1px;
            padding: 3px 0;
            transition: all 0.15s;
            z-index: 5;
            display: none;
            pointer-events: none;
        }
        #shift-banner.mode-normal {
            background: #e0e0e0;
            color: #555;
        }
        #shift-banner.mode-shift {
            background: var(--shift-bg);
            color: #333;
        }

        /* ===== TAB INTERFACE (反応式モード用) ===== */
        #tab-container {
            position: fixed;
            top: 0;
            left: 0;
            display: none;
            flex-direction: row;
            z-index: 25;
            background: white;
            border-bottom: 2px solid #ddd;
            width: 100%;
        }
        .tab-button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: #f0f0f0;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            border-right: 1px solid #ddd;
            transition: background 0.2s;
        }
        .tab-button:last-child {
            border-right: none;
        }
        .tab-button.active {
            background: #007bff;
            color: white;
        }
        .tab-button:hover {
            background: #e0e0e0;
        }
        .tab-button.active:hover {
            background: #0056b3;
        }

        #memo-panel {
            position: fixed;
            top: 40px;
            left: 0;
            width: 100%;
            height: calc(100% - 40px - var(--keyboard-total));
            background: white;
            display: none;
            flex-direction: column;
            z-index: 24;
            border-bottom: 1px solid #ddd;
        }
        #memo-canvas {
            flex: 1;
            border: 1px solid #ccc;
            cursor: crosshair;
            background: white;
            display: block;
        }
        #memo-controls {
            display: flex;
            gap: 8px;
            padding: 8px;
            background: #f9f9f9;
            border-top: 1px solid #ddd;
        }
        #memo-clear-btn {
            padding: 6px 12px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        #memo-clear-btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>

<div id="allend-overlay">
    <div id="allend-title">ALL END</div>
    <div id="allend-score"></div>
    <button id="allend-back" onclick="goToStart()">トップへ戻る</button>
    <div id="wrong-list-section" style="display:none;">
        <div id="wrong-list-title">❌ 間違えた問題</div>
        <div id="wrong-list"></div>
    </div>
</div>

<div id="message-overlay">
    <div id="message-content"></div>
    <div id="message-sub"></div>
    <div id="gacha-result">
        <img id="gacha-img" src="">
        <div id="gacha-prob"></div>
    </div>
    <button id="gacha-btn" class="menu-btn" style="display:none; background:#ffc107; color:black;" onclick="pullGacha()">ガチャを引く！</button>
    <button id="mix-btn" class="menu-btn" style="display:none; background:#6f42c1; color:white;" onclick="mixGacha()">🔀 混ぜる</button>
    <button id="next-btn-manual" class="menu-btn" style="display:none; background:#28a745;" onclick="closeMessageAndNext()">次の問題</button>
</div>

<div id="start-screen" class="screen active-screen">
    <h1>Versionを選択</h1>
    <div id="ver-list">読み込み中...</div>
    <button id="admin-trigger" onclick="tryAdminAccess()">管理者</button>
</div>

<div id="order-screen" class="screen">
    <h2>出題順を選択</h2>
    <button class="menu-btn" onclick="setOrder('normal')">順番どおり</button>
    <button class="menu-btn" onclick="setOrder('random')">ランダム</button>
</div>

<div id="style-screen" class="screen">
    <h2>基本モードを選択</h2>
    <button class="menu-btn" onclick="setBaseStyle('once')">一周モード</button>
    <button class="menu-btn" onclick="setBaseStyle('retry')">克服モード</button>
</div>

<div id="substyle-screen" class="screen">
    <h2>付加機能を選択</h2>
    <button class="menu-btn" onclick="setFinalStyle('gacha')" style="background:#ffc107; color:black;">ガチャモード (4回正解でガチャ)</button>
    <button class="menu-btn" onclick="setFinalStyle('study')" style="background:#17a2b8;">勉強モード</button>
</div>

<div id="admin-screen" class="screen">
    <h2>ADMIN CONSOLE</h2>
    <div id="admin-console"></div>
    <input type="text" id="admin-input" placeholder="Type command..." onkeydown="processAdminCommand(event)">
</div>

<!-- TAB INTERFACE (反応式モード用) -->
<div id="tab-container">
    <button class="tab-button active" onclick="switchTab('keyboard')">キーボード</button>
    <button class="tab-button" onclick="switchTab('memo')">メモ</button>
</div>

<!-- MEMO PANEL -->
<div id="memo-panel">
    <canvas id="memo-canvas"></canvas>
    <div id="memo-controls">
        <button id="memo-clear-btn" onclick="clearMemoCanvas()">クリア</button>
    </div>
</div>

<div id="henkan-panel"></div>

<div id="game-container">
    <div id="mondai-display"></div>
    <div id="answer-area"></div>
</div>

<!-- Shift mode banner -->
<div id="shift-banner" class="mode-normal">通常モード　a-z / ₁-₉</div>

<!--
    KEYBOARD LAYOUT

    通常モード (isShift = false):
      - a-z (小文字)
      - Number row: 下付き文字 ₁-₉ を入力

    Shiftモード (isShift = true):
      - A-Z (大文字)
      - Number row: 通常数字 1-9 を入力
-->
<div class="keyboard" id="main-keyboard">
    <!-- Number row -->
    <div class="row" id="num-row">
        <button class="key key-num" id="num-1" data-key="1" onclick="handleInput('1')">
            <span class="key-main" id="nkd-1">₁</span>
        </button>
        <button class="key key-num" id="num-2" data-key="2" onclick="handleInput('2')">
            <span class="key-main" id="nkd-2">₂</span>
        </button>
        <button class="key key-num" id="num-3" data-key="3" onclick="handleInput('3')">
            <span class="key-main" id="nkd-3">₃</span>
        </button>
        <button class="key key-num" id="num-4" data-key="4" onclick="handleInput('4')">
            <span class="key-main" id="nkd-4">₄</span>
        </button>
        <button class="key key-num" id="num-5" data-key="5" onclick="handleInput('5')">
            <span class="key-main" id="nkd-5">₅</span>
        </button>
        <button class="key key-num" id="num-6" data-key="6" onclick="handleInput('6')">
            <span class="key-main" id="nkd-6">₆</span>
        </button>
        <button class="key key-num" id="num-7" data-key="7" onclick="handleInput('7')">
            <span class="key-main" id="nkd-7">₇</span>
        </button>
        <button class="key key-num" id="num-8" data-key="8" onclick="handleInput('8')">
            <span class="key-main" id="nkd-8">₈</span>
        </button>
        <button class="key key-num" id="num-9" data-key="9" onclick="handleInput('9')">
            <span class="key-main" id="nkd-9">₉</span>
        </button>
    </div>
    <!-- Row 1: Q-P -->
    <div class="row">
        <button class="key" data-key="q" onclick="handleInput('q')"><span class="key-main" id="kd-q">q</span></button>
        <button class="key" data-key="w" onclick="handleInput('w')"><span class="key-main" id="kd-w">w</span></button>
        <button class="key" data-key="e" onclick="handleInput('e')"><span class="key-main" id="kd-e">e</span></button>
        <button class="key" data-key="r" onclick="handleInput('r')"><span class="key-main" id="kd-r">r</span></button>
        <button class="key" data-key="t" onclick="handleInput('t')"><span class="key-main" id="kd-t">t</span></button>
        <button class="key" data-key="y" onclick="handleInput('y')"><span class="key-main" id="kd-y">y</span></button>
        <button class="key" data-key="u" onclick="handleInput('u')"><span class="key-main" id="kd-u">u</span></button>
        <button class="key" data-key="i" onclick="handleInput('i')"><span class="key-main" id="kd-i">i</span></button>
        <button class="key" data-key="o" onclick="handleInput('o')"><span class="key-main" id="kd-o">o</span></button>
        <button class="key" data-key="p" onclick="handleInput('p')"><span class="key-main" id="kd-p">p</span></button>
    </div>
    <!-- Row 2: A-L -->
    <div class="row">
        <button class="key" data-key="a" onclick="handleInput('a')"><span class="key-main" id="kd-a">a</span></button>
        <button class="key" data-key="s" onclick="handleInput('s')"><span class="key-main" id="kd-s">s</span></button>
        <button class="key" data-key="d" onclick="handleInput('d')"><span class="key-main" id="kd-d">d</span></button>
        <button class="key" data-key="f" onclick="handleInput('f')"><span class="key-main" id="kd-f">f</span></button>
        <button class="key" data-key="g" onclick="handleInput('g')"><span class="key-main" id="kd-g">g</span></button>
        <button class="key" data-key="h" onclick="handleInput('h')"><span class="key-main" id="kd-h">h</span></button>
        <button class="key" data-key="j" onclick="handleInput('j')"><span class="key-main" id="kd-j">j</span></button>
        <button class="key" data-key="k" onclick="handleInput('k')"><span class="key-main" id="kd-k">k</span></button>
        <button class="key" data-key="l" onclick="handleInput('l')"><span class="key-main" id="kd-l">l</span></button>
    </div>
    <!-- Row 3: Shift, Z-M, Backspace -->
    <div class="row">
        <button class="key key-special" data-key="Shift" id="shift-key" onclick="handleInput('Shift')">Shift</button>
        <button class="key" data-key="z" onclick="handleInput('z')"><span class="key-main" id="kd-z">z</span></button>
        <button class="key" data-key="x" onclick="handleInput('x')"><span class="key-main" id="kd-x">x</span></button>
        <button class="key" data-key="c" onclick="handleInput('c')"><span class="key-main" id="kd-c">c</span></button>
        <button class="key" data-key="v" onclick="handleInput('v')"><span class="key-main" id="kd-v">v</span></button>
        <button class="key" data-key="b" onclick="handleInput('b')"><span class="key-main" id="kd-b">b</span></button>
        <button class="key" data-key="n" onclick="handleInput('n')"><span class="key-main" id="kd-n">n</span></button>
        <button class="key" data-key="m" onclick="handleInput('m')"><span class="key-main" id="kd-m">m</span></button>
        <button class="key key-special" data-key="Backspace" onclick="handleInput('Backspace')">⌫</button>
    </div>
    <!-- Row 4: →, ;(+), Space, Enter -->
    <div class="row">
        <button class="key key-wide" data-key="ArrowRight" onclick="handleInput('ArrowRight')">→</button>
        <button class="key key-wide" data-key=";" onclick="handleInput(';')">+</button>
        <button class="key key-space" data-key=" " id="space-key" onclick="handleInput(' ')">Space</button>
        <button class="key key-special" data-key="Enter" onclick="handleInput('Enter')">Enter</button>
    </div>
</div>

<script type="module">

    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        messagingSenderId: "218450334268",
        appId: "1:218450334268:web:37590aa47de792b5c4e939",

    const app = initializeApp(firebaseConfig);

<script>
    // ===== State =====
    let playStyle = 'once', subStyle = 'gacha', playOrder = 'normal';
    let currentPool = [], currentPos = 0;
    let inputs = [], activeInputIdx = 0;
    let isShift = false;
    // isZenkaku: 全角モード（ひらがな入力）。全角固定バージョンでは切り替え不可
    let isZenkaku = false;
    let isZenkakuFixed = false; // true = 全角固定（切り替え不可）
    let romaBuffer = '';
    let henkanMode = false;
    let henkanBase = '';
    let henkanList = [];
    let henkanIdx  = 0;
    let isWaiting = false;
    let correctCount = 0, totalQuestions = 0;
    let retryPool = [], wrongAnswers = [];

    // 選択中のバージョンインデックス（0-based）
    let selectedVerIdx = 0;

    // 全角固定にするバージョン（0-based インデックス）: Ver.2(1), Ver.4(3)
    const ZENKAKU_FIXED_VERS = new Set([1, 3]);

    const SUB_DIGITS = ['₁','₂','₃','₄','₅','₆','₇','₈','₉'];
    const NRM_DIGITS = ['1','2','3','4','5','6','7','8','9'];

    const GACHA_TABLE = [
        { src: "nso/Co_transparent.png", prob: 40 },
        { src: "nso/Eo_transparent.png", prob: 40 },
        { src: "nso/Ao_transparent.png", prob: 10 },

    ];

    // ===== MEMO CANVAS STATE =====
    let memoCanvas = null;
    let memoCtx = null;
    let isDrawing = false;
    let lastX = 0, lastY = 0;

    function initMemoCanvas() {
        memoCanvas = document.getElementById('memo-canvas');
        if (!memoCanvas) return;
        memoCtx = memoCanvas.getContext('2d');
        
        // キャンバスサイズを親要素に合わせる
        const container = document.getElementById('memo-panel');
        memoCanvas.width = container.clientWidth;
        memoCanvas.height = container.clientHeight - 50; // controls分を引く
        
        // 背景を白で塗る
        memoCtx.fillStyle = 'white';
        memoCtx.fillRect(0, 0, memoCanvas.width, memoCanvas.height);
        
        // マウスイベント
        memoCanvas.addEventListener('mousedown', startDrawing);
        memoCanvas.addEventListener('mousemove', draw);
        memoCanvas.addEventListener('mouseup', stopDrawing);
        memoCanvas.addEventListener('mouseout', stopDrawing);
        
        // タッチイベント
        memoCanvas.addEventListener('touchstart', handleTouchStart, false);
        memoCanvas.addEventListener('touchmove', handleTouchMove, false);
        memoCanvas.addEventListener('touchend', stopDrawing, false);
    }

    function startDrawing(e) {
        isDrawing = true;
        const rect = memoCanvas.getBoundingClientRect();
        lastX = e.clientX - rect.left;
        lastY = e.clientY - rect.top;
    }

    function draw(e) {
        if (!isDrawing) return;
        const rect = memoCanvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        memoCtx.strokeStyle = '#000000';
        memoCtx.lineWidth = 2;
        memoCtx.lineCap = 'round';
        memoCtx.lineJoin = 'round';
        
        memoCtx.beginPath();
        memoCtx.moveTo(lastX, lastY);
        memoCtx.lineTo(x, y);
        memoCtx.stroke();
        
        lastX = x;
        lastY = y;
    }

    function stopDrawing() {
        isDrawing = false;
    }

    function handleTouchStart(e) {
        e.preventDefault();
        isDrawing = true;
        const rect = memoCanvas.getBoundingClientRect();
        const touch = e.touches[0];
        lastX = touch.clientX - rect.left;
        lastY = touch.clientY - rect.top;
    }

    function handleTouchMove(e) {
        e.preventDefault();
        if (!isDrawing) return;
        const rect = memoCanvas.getBoundingClientRect();
        const touch = e.touches[0];
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        
        memoCtx.strokeStyle = '#000000';
        memoCtx.lineWidth = 2;
        memoCtx.lineCap = 'round';
        memoCtx.lineJoin = 'round';
        
        memoCtx.beginPath();
        memoCtx.moveTo(lastX, lastY);
        memoCtx.lineTo(x, y);
        memoCtx.stroke();
        
        lastX = x;
        lastY = y;
    }

    function clearMemoCanvas() {
        if (!memoCtx) return;
        memoCtx.fillStyle = 'white';
        memoCtx.fillRect(0, 0, memoCanvas.width, memoCanvas.height);
    }

    // ===== TAB SWITCHING =====
    function switchTab(tab) {
        const tabContainer = document.getElementById('tab-container');
        const memoPanel = document.getElementById('memo-panel');

            memoPanel.style.display = 'flex';

    // ===== Keyboard display update =====
    function updateKeyboardDisplay() {
        const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
        letters.forEach(c => {
            const el = document.getElementById(`kd-${c}`);
            // 通常モード(isShift=false): 小文字 / Shiftモード(isShift=true): 大文字
            if (el) el.textContent = isShift ? c.toUpperCase() : c;

        // Shift key visual
        const shiftKey = document.getElementById('shift-key');
        if (isShift) {

        } else {
            shiftKey.classList.remove('shift-active');
        }

        // Number keys:
        //   通常モード (isShift=false): ₁-₉ (下付き)
        //   Shiftモード (isShift=true): 1-9 (通常数字)
        for (let i = 1; i <= 9; i++) {
            const el = document.getElementById(`nkd-${i}`);
            if (el) el.textContent = isShift ? String(i) : SUB_DIGITS[i - 1];
            const btn = document.getElementById(`num-${i}`);

        // Banner
        const banner = document.getElementById('shift-banner');

            banner.textContent = '通常モード　a-z / ₁-₉';

        // Spaceキーのラベル: 全角固定時は「文字変換」
        const spaceKey = document.getElementById('space-key');
        if (spaceKey) {
            spaceKey.textContent = isZenkakuFixed ? '文字変換' : 'Space';

    }

    function flashKey(key) {
        if (key === 'Shift') return;
        let selector;
        if (/^[1-9]$/.test(key)) {
            selector = `#num-${key}`;
        } else {
            selector = `.key[data-key="${CSS.escape(key)}"]`;
        }
        const btn = document.querySelector(selector);
        if (!btn || btn.classList.contains('key-disabled')) return;
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 150);
    }


    // ===== ローマ字→ひらがな変換テーブル =====
    const ROMA_TABLE = [
        // 4文字
        ['xtsu','っ'],['ltsu','っ'],
        // 3文字優先
        ['chi','ち'],['tsu','つ'],['sha','しゃ'],['shi','し'],['shu','しゅ'],['sho','しょ'],
        ['tya','ちゃ'],['tu','つ'],['tyu','ちゅ'],['tye','ちぇ'],['tyo','ちょ'],
        ['cha','ちゃ'],['chu','ちゅ'],['cho','ちょ'],['che','ちぇ'],
        ['dya','ぢゃ'],['dyu','ぢゅ'],['dyo','ぢょ'],
        ['nya','にゃ'],['nyu','にゅ'],['nyo','にょ'],
        ['hya','ひゃ'],['hyu','ひゅ'],['hyo','ひょ'],
        ['mya','みゃ'],['myu','みゅ'],['myo','みょ'],
        ['rya','りゃ'],['ryu','りゅ'],['ryo','りょ'],
        ['gya','ぎゃ'],['gyu','ぎゅ'],['gyo','ぎょ'],
        ['bya','びゃ'],['byu','びゅ'],['byo','びょ'],
        ['pya','ぴゃ'],['pyu','ぴゅ'],['pyo','ぴょ'],
        ['kya','きゃ'],['kyu','きゅ'],['kyo','きょ'],
        ['sya','しゃ'],['syu','しゅ'],['syo','しょ'],
        ['zya','じゃ'],['zyu','じゅ'],['zyo','じょ'],
        ['ja' ,'じゃ'],['ju' ,'じゅ'],['jo' ,'じょ'],['je','じぇ'],

        // 2文字
        ['ka','か'],['ki','き'],['ku','く'],['ke','け'],['ko','こ'],
        ['sa','さ'],['si','し'],['su','す'],['se','せ'],['so','そ'],
        ['ta','た'],['ti','ち'],['te','て'],['to','と'],
        ['na','な'],['ni','に'],['nu','ぬ'],['ne','ね'],['no','の'],
        ['ha','は'],['hi','ひ'],['hu','ふ'],['he','へ'],['ho','ほ'],
        ['ma','ま'],['mi','み'],['mu','む'],['me','め'],['mo','も'],
        ['ya','や'],['yu','ゆ'],['yo','よ'],
        ['ra','ら'],['ri','り'],['ru','る'],['re','れ'],['ro','ろ'],
        ['wa','わ'],['wi','ゐ'],['we','ゑ'],['wo','を'],
        ['ga','が'],['gi','ぎ'],['gu','ぐ'],['ge','げ'],['go','ご'],
        ['za','ざ'],['zi','じ'],['zu','ず'],['ze','ぜ'],['zo','ぞ'],
        ['da','だ'],['di','ぢ'],['du','づ'],['de','で'],['do','ど'],

        ['fa','ふぁ'],['fi','ふぃ'],['fu','ふ'],['fe','ふぇ'],['fo','ふぉ'],
        ['xa','ぁ'],['xi','ぃ'],['xu','ぅ'],['xe','ぇ'],['xo','ぉ'],
        ['xya','ゃ'],['xyu','ゅ'],['xyo','ょ'],['xtu','っ'],

        ['va','ヴぁ'],['vi','ヴぃ'],['vu','ヴ'],['ve','ヴぇ'],['vo','ヴぉ'],

        // n は特別処理するのでここには入れない
    ];

    // ローマ字バッファを変換。変換できた文字を返し、残りをバッファに残す
    function tryConvertRoma(buf) {
        // っ: 同じ子音が2つ続いた場合（n以外）
        if (buf.length >= 2 && buf[0] === buf[1] && buf[0] !== 'n') {
            return { out: 'っ', rest: buf.slice(1) };
        }
        // 長い順にマッチ試行
        for (const [roma, hira] of ROMA_TABLE) {
            if (buf.startsWith(roma)) {
                return { out: hira, rest: buf.slice(roma.length) };
            }
        }
        // バッファが長くなりすぎたら先頭を捨てる
        if (buf.length >= 5) {
            return { out: buf[0], rest: buf.slice(1) };
        }
        return null;
    }

    function flushRomaBuffer(forceFlush) {
        let result = '';
        if (romaBuffer === 'n') {
            if (forceFlush) { result = 'ん'; romaBuffer = ''; }
        } else {
            const res = tryConvertRoma(romaBuffer);
            if (res) {
                result = res.out;
                romaBuffer = res.rest;
                if (romaBuffer.length > 0) {
                    const more = flushRomaBuffer(false);
                    result += more;
                }
            }
        }
        return result;
    }

    function inputRomaChar(c) {
        const letter = c.toLowerCase();
        const isVowel = 'aiueo'.includes(letter);

        // 「ん」の判定:
        // バッファが 'n' のとき:
        //   - 次が 'n' → 'nn' で「ん」確定、バッファリセット
        //   - 次が 母音(a/i/u/e/o) → na/ni/nu/ne/no として処理（「ん」にしない）
        //   - 次が その他の子音 → 「ん」確定してから次の文字をバッファへ
        if (romaBuffer === 'n') {
            if (letter === 'n') {
                // nn → 「ん」確定
                inputs[activeInputIdx] += 'ん';
                romaBuffer = '';
                updateDisplay();
                return;
            } else if (!isVowel) {
                // 子音が来た → 「ん」確定
                inputs[activeInputIdx] += 'ん';
                romaBuffer = '';
            }
            // 母音が来た場合はそのまま（na/ni等として処理続行）
        }

        romaBuffer += letter;

        let converted = '';
        while (romaBuffer.length > 0) {
            const res = tryConvertRoma(romaBuffer);
            if (res) {
                converted += res.out;
                romaBuffer = res.rest;
            } else {
                break;
            }
        }
        if (converted) inputs[activeInputIdx] += converted;
    }


    // ===== Google IME API による漢字変換 =====
    async function fetchHenkan(hiragana) {
        try {
            const url = `https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(hiragana + ',')}`;
            const res = await fetch(url);
            const json = await res.json();
            const candidates = [];
            json.forEach(seg => { if (seg[1]) seg[1].forEach(c => { if (!candidates.includes(c)) candidates.push(c); }); });
            return candidates.length > 0 ? candidates : [hiragana];
        } catch(e) {
            return [hiragana];
        }
    }

    function showHenkanPanel(candidates, base) {
        henkanMode = true;
        henkanList = candidates;
        henkanBase = base;
        henkanIdx  = 0;
        const panel = document.getElementById('henkan-panel');
        panel.innerHTML = '';
        candidates.forEach((c, i) => {
            const el = document.createElement('div');
            el.className = 'henkan-item' + (i === 0 ? ' selected' : '');
            el.textContent = c;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); selectHenkan(i); }, {passive: false});
            el.addEventListener('mousedown',  (e) => { e.preventDefault(); selectHenkan(i); });
            panel.appendChild(el);
        });
        panel.style.display = 'flex';
    }

    function selectHenkan(idx) {
        const chosen = henkanList[idx];
        const cur = inputs[activeInputIdx];
        if (cur.endsWith(henkanBase)) {
            inputs[activeInputIdx] = cur.slice(0, cur.length - henkanBase.length) + chosen;
        } else {
            inputs[activeInputIdx] += chosen;
        }
        closeHenkanPanel();
        updateDisplay();
    }

    function closeHenkanPanel() {
        henkanMode = false;
        henkanList = [];
        henkanBase = '';
        henkanIdx  = 0;
        const panel = document.getElementById('henkan-panel');
        panel.style.display = 'none';
        panel.innerHTML = '';
    }

    function getTrailingHiragana(str) {
        const m = str.match(/[\u3041-\u3096ー]+$/);
        return m ? m[0] : '';
    }

    // ===== Input handler =====
    function handleInput(key) {
        if (isWaiting) return;
        if (document.getElementById('admin-screen').classList.contains('active-screen')) return;
        if (document.getElementById('game-container').style.display !== 'flex') return;

        if (key === 'Shift') {
            isShift = !isShift;
            updateKeyboardDisplay();
            return;
        }

        // 全角半角トグルは全角固定時は無効
        if (key === 'Zenkaku') {
            if (isZenkakuFixed) return; // 固定時は切り替え不可
            isZenkaku = !isZenkaku;
            romaBuffer = '';
            updateKeyboardDisplay();
            return;
        }

        flashKey(key);

        if (key === 'Backspace') {
            if (henkanMode) { closeHenkanPanel(); updateDisplay(); return; }
            if (isZenkaku && romaBuffer.length > 0) {
                romaBuffer = romaBuffer.slice(0, -1);
            } else if (inputs[activeInputIdx] === '') {
                if (activeInputIdx > 0) activeInputIdx--;
            } else {
                inputs[activeInputIdx] = inputs[activeInputIdx].slice(0, -1);
            }
        } else if (key === 'Enter') {
            if (henkanMode) {
                selectHenkan(henkanIdx);
                return;
            }
            if (isZenkaku && romaBuffer.length > 0) {
                const flushed = flushRomaBuffer(true);
                if (flushed) inputs[activeInputIdx] += flushed;
                romaBuffer = '';
            }
            if (inputs.length > 1 && activeInputIdx < inputs.length - 1) {
                activeInputIdx++;
            } else {
                checkAnswer();
            }
        } else if (key === ' ') {
            if (isZenkaku) {
                // バッファ残りをフラッシュ
                if (romaBuffer.length > 0) {
                    const flushed = flushRomaBuffer(true);
                    if (flushed) inputs[activeInputIdx] += flushed;
                    romaBuffer = '';
                    updateDisplay();
                }
                if (henkanMode) {
                    henkanIdx = (henkanIdx + 1) % henkanList.length;
                    document.querySelectorAll('.henkan-item').forEach((el, i) => {
                        el.classList.toggle('selected', i === henkanIdx);
                    });
                } else {
                    const hira = getTrailingHiragana(inputs[activeInputIdx]);
                    if (hira.length > 0) {
                        fetchHenkan(hira).then(candidates => {
                            showHenkanPanel(candidates, hira);
                            updateDisplay();
                        });
                    }
                }
                return;
            }
            inputs[activeInputIdx] += ' ';
            if (activeInputIdx < inputs.length - 1) activeInputIdx++;
        } else if (key === 'ArrowRight') {
            if (isZenkaku && romaBuffer.length > 0) {
                const flushed = flushRomaBuffer(true);
                if (flushed) inputs[activeInputIdx] += flushed;
                romaBuffer = '';
            }
            if (activeInputIdx < inputs.length - 1) activeInputIdx++;
        } else if (/^[a-z]$/i.test(key)) {
            if (isZenkaku) {
                inputRomaChar(key);
            } else {
                inputs[activeInputIdx] += isShift ? key.toUpperCase() : key;
            }
        } else if (/^[0-9]$/.test(key)) {
            if (isShift) {
                inputs[activeInputIdx] += key;
            } else {
                inputs[activeInputIdx] += SUB_DIGITS[parseInt(key) - 1];
            }
        } else if (key === ';') {
            inputs[activeInputIdx] += '+';
        }
        updateDisplay();
    }

    function updateDisplay() {
        inputs.forEach((v, i) => {
            const b = document.getElementById(`box-${i}`);
            if (!b) return;
            b.classList.remove('active-box');
            b.innerHTML = '';
            if (i === activeInputIdx) {
                b.classList.add('active-box');
                b.style.color = '#007bff';
                const confirmed = document.createElement('span');
                confirmed.textContent = v.replace(/ /g, ' ');
                b.appendChild(confirmed);
                if (isZenkaku && romaBuffer.length > 0) {
                    const pending = document.createElement('span');
                    pending.textContent = romaBuffer;
                    pending.style.cssText = 'text-decoration: underline; color: #0056b3; font-style: italic;';
                    b.appendChild(pending);
                }
                const cursor = document.createElement('span');
                cursor.className = 'cursor';
                b.appendChild(cursor);
            } else {
                b.style.color = '#222';
                b.textContent = v.replace(/ /g, ' ');
            }
        });
    }

    function checkAnswer() {
        isWaiting = true;
        const idx = currentPool[currentPos];
        const { kotae: ans } = resolveQuestion(idx);
        const userAns = inputs.map(v => v.trim());
        const correct = userAns.every((u, i) => u === (ans[i] || ''));

        if (correct) {
            correctCount++;
            if (subStyle === 'gacha' && correctCount % 4 === 0) {
                showMessage('正解！', `${correctCount}問目`, true);
            } else {
                showMessage('正解！', '', false);
            }
        } else {
            wrongAnswers.push({ mondai: document.getElementById('mondai-display').innerText, ans, userAns });
            if (playStyle === 'retry') {
                retryPool.push(idx);
            }
            showMessage('不正解', `正解: ${ans.join('')}`, false);
        }
    }

    function showMessage(title, sub, showGacha) {
        document.getElementById('message-content').innerText = title;
        document.getElementById('message-sub').innerText = sub;
        const overlay = document.getElementById('message-overlay');
        overlay.style.display = 'flex';

        if (showGacha) {
            document.getElementById('gacha-result').style.display = 'block';
            document.getElementById('gacha-btn').style.display = 'block';
            document.getElementById('mix-btn').style.display = 'block';
            document.getElementById('next-btn-manual').style.display = 'none';
        } else {
            document.getElementById('gacha-result').style.display = 'none';
            document.getElementById('gacha-btn').style.display = 'none';
            document.getElementById('mix-btn').style.display = 'none';
            document.getElementById('next-btn-manual').style.display = 'block';
        }
    }

    function closeMessageAndNext() {
        document.getElementById('message-overlay').style.display = 'none';
        currentPos++;
        if (currentPos >= currentPool.length) {
            if (playStyle === 'retry' && retryPool.length > 0) {
                currentPool = retryPool;
                retryPool = [];
                currentPos = 0;
            } else {
                endGame();
                return;
            }
        }
        loadQuestion();
        isWaiting = false;
    }

    function pullGacha() {
        const rand = Math.random() * 100;
        let cumulative = 0;
        let chosen = GACHA_TABLE[0];
        for (const item of GACHA_TABLE) {
            cumulative += item.prob;
            if (rand < cumulative) {
                chosen = item;
                break;
            }
        }
        document.getElementById('gacha-img').src = chosen.src;
        document.getElementById('gacha-prob').innerText = `確率: ${chosen.prob}%`;
    }

    function mixGacha() {
        // 混ぜる機能（既存のロジック維持）
    }

    function endGame() {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('main-keyboard').style.display = 'none';
        document.getElementById('shift-banner').style.display = 'none';
        document.getElementById('tab-container').style.display = 'none';
        document.getElementById('memo-panel').style.display = 'none';

        const allendOverlay = document.getElementById('allend-overlay');
        allendOverlay.style.display = 'flex';
        document.getElementById('allend-score').innerText = `${correctCount} / ${totalQuestions}`;

        if (wrongAnswers.length > 0) {
            const wrongSection = document.getElementById('wrong-list-section');
            wrongSection.style.display = 'block';
            const wrongList = document.getElementById('wrong-list');
            wrongList.innerHTML = '';
            wrongAnswers.forEach(item => {
                const div = document.createElement('div');
                div.className = 'wrong-item';
                div.innerHTML = `
                    <div class="wi-mondai">${item.mondai}</div>
                    <div class="wi-answer">正解: <span>${item.ans.join('')}</span></div>
                    <div class="wi-answer">あなた: <span>${item.userAns.join('')}</span></div>
                `;
                wrongList.appendChild(div);
            });
        }
    }

    function goToStart() {
        document.getElementById('allend-overlay').style.display = 'none';
        showScreen('start-screen');
    }

    // ===== Screen management =====
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        if (screenId) {
            document.getElementById(screenId).classList.add('active-screen');
        }
    }

    // ===== Data resolution =====
    function resolveQuestion(idx) {
        if (idx < 0 || idx >= window.rawMondai.length) {
            return { mondai: '?', kotae: ['?'], kaitouran: '()' };
        }

        const mondai = window.rawMondai[idx];
        const kotaeGroup = window.rawKotaeGroups[idx] || [];
        const kaitouran = window.kaitouran[idx] || '()';

        let kotae = [];
        if (Array.isArray(kotaeGroup)) {
            kotae = kotaeGroup;
        } else if (typeof kotaeGroup === 'string') {
            kotae = [kotaeGroup];
        }

        // CHANGE_PAIRS による入れ替え
        const verStart = selectedVerIdx === 0 ? 0 : (window.hani_end[selectedVerIdx - 1] + 1);
        const relativeIdx = idx - verStart;
        for (const [v1, v2] of CHANGE_PAIRS) {
            if (selectedVerIdx === v1) {
                const pairIdx = window.hani_end[v2] - window.hani_end[v1] + relativeIdx;
                const pairKotaeGroup = window.rawKotaeGroups[pairIdx] || [];
                let pairKotae = [];
                if (Array.isArray(pairKotaeGroup)) {
                    pairKotae = pairKotaeGroup;
                } else if (typeof pairKotaeGroup === 'string') {
                    pairKotae = [pairKotaeGroup];
                }
                kotae = pairKotae;
            } else if (selectedVerIdx === v2) {
                const pairIdx = window.hani_end[v1] - window.hani_end[v2] + relativeIdx;
                const pairKotaeGroup = window.rawKotaeGroups[pairIdx] || [];
                let pairKotae = [];
                if (Array.isArray(pairKotaeGroup)) {
                    pairKotae = pairKotaeGroup;
                } else if (typeof pairKotaeGroup === 'string') {
                    pairKotae = [pairKotaeGroup];
                }
                kotae = pairKotae;
            }
        }

        return { mondai, kotae, kaitouran };
    }

    function renderVerList() {
        const listEl = document.getElementById('ver-list');
        if (!listEl) return;
        listEl.innerHTML = '';
        const count = Math.min(window.hani_end.length, 5);
        for (let i = 0; i < count; i++) {
            const val = window.hani_end[i];
            const btn = document.createElement('button');
            btn.className = 'menu-btn';
            btn.innerText = VER_LABELS[i] || `Ver.${i + 1}`;
            btn.onclick = () => {
                selectedVerIdx = i;
                const start = i === 0 ? 0 : window.hani_end[i-1] + 1;
                currentPool = Array.from({length: val - start + 1}, (_, k) => k + start);
                showScreen('order-screen');
            };
            listEl.appendChild(btn);
        }
    }

    function setOrder(o) { playOrder = o; showScreen('style-screen'); }
    function setBaseStyle(s) { playStyle = s; showScreen('substyle-screen'); }
    function setFinalStyle(s) {
        subStyle = s; correctCount = 0; startGame();
    }

    function startGame() {
        currentPos = 0; correctCount = 0; totalQuestions = 0;
        retryPool = []; wrongAnswers = [];
        if (playOrder === 'random') currentPool.sort(() => Math.random() - 0.5);
        totalQuestions = currentPool.length;
        showScreen('');
        document.getElementById('game-container').style.display = 'flex';
        document.getElementById('main-keyboard').style.display = 'block';
        document.getElementById('shift-banner').style.display = 'block';

        // 反応式モード（Ver.5, selectedVerIdx=4）の場合のみタブを表示
        if (selectedVerIdx === 4) {
            document.getElementById('tab-container').style.display = 'flex';
        } else {
            document.getElementById('tab-container').style.display = 'none';
            document.getElementById('memo-panel').style.display = 'none';
        }

        // 全角固定バージョン判定
        isZenkakuFixed = ZENKAKU_FIXED_VERS.has(selectedVerIdx);
        isZenkaku = isZenkakuFixed; // 固定バージョンは最初から全角ON

        isShift = false; // 必ず通常モードで開始
        romaBuffer = '';
        closeHenkanPanel();
        updateKeyboardDisplay();
        loadQuestion();
    }

    function loadQuestion() {
        const idx = currentPool[currentPos];
        const { mondai, kotae: ans, kaitouran: template } = resolveQuestion(idx);
        document.getElementById('mondai-display').innerText = mondai;
        const area = document.getElementById('answer-area');
        area.innerHTML = '';

        const parts = template.split('()');
        inputs = new Array(parts.length - 1).fill('');
        activeInputIdx = 0;

        parts.forEach((pt, i) => {
            if (pt !== '') {
                const span = document.createElement('span');
                span.innerText = pt;
                area.appendChild(span);
            }
            if (i < parts.length - 1) {
                const b = document.createElement('div');
                b.className = 'input-box';
                b.id = `box-${i}`;
                const ansLen = (ans[i] || '').length;
                if (ansLen > 0) b.style.minWidth = Math.max(50, ansLen * 14) + 'px';
                area.appendChild(b);
            }
        });

        updateDisplay();
    }

    // ===== Render =====
    const VER_LABELS = [
        '元素記号を答える',
        '元素名を答える',
        '分子名を化学式で答える',
        '化学式を分子名で答える',
        '反応を化学式で答える',
    ];

    const CHANGE_PAIRS = [[0,1],[2,3]];

    function verStart(vi) {
        return vi === 0 ? 0 : (window.hani_end[vi-1] + 1);
    }

    // ===== Admin =====
    function tryAdminAccess() {
        const pass = prompt('パスワード:');
        if (pass === window.adminPass) {
            showScreen('admin-screen');
        } else {
            alert('不正なパスワード');
        }
    }

    function processAdminCommand(event) {
        if (event.key !== 'Enter') return;
        const input = document.getElementById('admin-input');
        const cmd = input.value.trim();
        input.value = '';

        const console = document.getElementById('admin-console');
        console.textContent += `> ${cmd}\n`;

        if (cmd === 'save') {
            window.saveToFirebase();
            console.textContent += 'Saved to Firebase\n';
        } else if (cmd === 'clear') {
            console.textContent = '';
        } else {
            console.textContent += 'Unknown command\n';
        }
        console.scrollTop = console.scrollHeight;
    }
</script>

</body>
