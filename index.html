<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gensonso</title>
    <meta property="og:title" content="Gensonso" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="元素の勉強に使ってください。" />
    <meta property="og:site_name" content="Gensonso" />
    
    <style>
        :root {
            --key-bg: #ffffff;
            --bg-color: #d1d4d9;
            --special-key-bg: #adb5bd;
            --active-bg: #a0a0a0;
            --shift-bg: #ffc107;
            --disabled-key-bg: #e8e8e8;
            --disabled-key-color: #bbb;

            --key-height: 48px;
            --key-font: 16px;
            --key-mb: 7px;
            --kbd-padding: 9px;
            --num-row-height: 40px;
            --num-row-font: 13px;
            /* 5 rows: num row + 4 alpha rows */
            --keyboard-total: calc(var(--num-row-height) + var(--key-height) * 4 + var(--key-mb) * 5 + var(--kbd-padding) * 2);
        }

        @media (max-height: 600px) {
            :root {
                --key-height: 34px;
                --key-font: 12px;
                --key-mb: 4px;
                --kbd-padding: 5px;
                --num-row-height: 30px;
                --num-row-font: 11px;
            }
        }
        @media (max-height: 700px) and (min-height: 601px) {
            :root {
                --key-height: 40px;
                --key-font: 14px;
                --key-mb: 5px;
                --kbd-padding: 7px;
                --num-row-height: 34px;
                --num-row-font: 12px;
            }
        }
        @media (max-width: 360px) {
            :root {
                --key-font: 11px;
                --num-row-font: 10px;
            }
        }

        * {
            touch-action: manipulation;
            box-sizing: border-box;
        }
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
            padding: 16px; overflow-y: auto;
        }
        .active-screen { display: flex; }

        .menu-btn {
            padding: 15px 30px; margin: 8px; font-size: clamp(14px, 4vw, 18px);
            cursor: pointer; border: none; background: #007bff; color: white; border-radius: 8px;
            min-width: min(280px, 85vw); transition: 0.2s;
        }

        #admin-trigger {
            position: absolute; bottom: 20px; right: 20px;
            padding: 8px 15px; background: #6c757d; color: white;
            border-radius: 5px; cursor: pointer; font-size: 12px; border: none; opacity: 0.6;
        }
        #admin-screen {
            background: #1e1e1e; color: #00ff00; font-family: monospace;
            padding: 20px; box-sizing: border-box;
        }
        #admin-console {
            width: 95%; height: 60%; background: #000; color: #00ff00;
            padding: 10px; overflow-y: auto; border: 1px solid #333;
            margin-bottom: 10px; font-size: 14px; white-space: pre-wrap;
        }
        #admin-input {
            width: 95%; background: #000; color: #00ff00;
            border: 1px solid #00ff00; padding: 10px;
            font-family: monospace; outline: none;
        }

        #message-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; background: rgba(255,255,255,0.95);
            overflow-y: auto; padding: 10px 16px;
        }
        #message-content {
            font-size: clamp(32px, 10vw, 70px); font-weight: bold;
        }
        #message-sub {
            font-size: clamp(13px, 3.5vw, 22px);
            color: #333; margin: 8px 0; text-align: center; padding: 0 8px;
        }

        #gacha-result { text-align: center; margin-top: 8px; display: none; }
        #gacha-img {
            max-width: min(220px, 42vw); max-height: 22vh;
            width: auto; height: auto;
            border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #gacha-prob {
            margin-top: 6px; font-weight: bold; color: #666;
            font-size: clamp(11px, 3vw, 15px);
        }

        #game-container {
            position: fixed; top: 0; left: 0; width: 100%;
            height: calc(100% - var(--keyboard-total));
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 8px 16px; overflow-y: auto;
        }
        #mondai-display {
            font-size: clamp(14px, 4vw, 22px); margin-bottom: 12px; color: #555;
        }
        #answer-area {
            font-size: clamp(18px, 5vw, 28px); font-weight: bold;
            display: flex; flex-wrap: wrap;
            justify-content: center; gap: 8px; align-items: center;
        }
        .input-box {
            border-bottom: 3px solid #ccc;
            min-width: clamp(50px, 15vw, 80px);
            height: clamp(30px, 8vw, 40px);
            display: flex; align-items: center; justify-content: center;
            padding: 0 5px;
        }
        .input-box.active-box { border-bottom-color: #007bff; color: #007bff; }
        .cursor {
            width: 2px; height: clamp(18px, 5vw, 24px);
            background-color: #007bff; animation: blink 0.8s infinite; margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ===== KEYBOARD ===== */
        .keyboard {
            position: fixed; bottom: 0; width: 100%;
            background-color: var(--bg-color);
            padding: var(--kbd-padding) 0;
            display: none;
            padding-bottom: calc(var(--kbd-padding) + env(safe-area-inset-bottom, 0px));
            z-index: 100;
        }
        .row {
            display: flex; justify-content: center; margin-bottom: var(--key-mb);
        }
        .row:last-child { margin-bottom: 0; }

        /* Normal keys */
        .key {
            flex: 1; margin: 0 2px;
            background-color: var(--key-bg);
            border: none; border-radius: 5px;
            font-size: var(--key-font);
            cursor: pointer;
            box-shadow: 0 3px 0 #999;
            transition: transform 0.08s, box-shadow 0.08s, background-color 0.1s;
            touch-action: manipulation;
            user-select: none; -webkit-user-select: none;
            min-width: 0; padding: 0 1px;
            color: #222;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 1px;
            height: var(--key-height);
        }
        /* Number row keys are shorter */
        .key-num {
            height: var(--num-row-height);
            font-size: var(--num-row-font);
        }
        .key.active {
            background-color: var(--active-bg) !important;
            box-shadow: 0 1px 0 #999;
            transform: translateY(2px);
        }
        .key.key-disabled {
            background-color: var(--disabled-key-bg);
            color: var(--disabled-key-color);
            cursor: not-allowed;
            box-shadow: 0 2px 0 #ccc;
            pointer-events: none;
        }
        .key-special { background-color: var(--special-key-bg); flex: 1.5; }
        .key-wide { flex: 2; }
        .key-space { flex: 4; }
        .key.shift-active {
            background-color: var(--shift-bg) !important;
            color: #222; font-weight: bold;
        }

        /* Sub-label */
        .key-main { line-height: 1; }
        .key-sub {
            font-size: 0.6em; color: #888; line-height: 1;
        }
        .key.shift-active .key-sub { color: #555; }

        .key-num .key-main { font-size: 1em; }
        .key-num .key-sub  { font-size: 0.65em; color: #999; }

        /* ===== ALL END ===== */
        #allend-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column;
            align-items: center; justify-content: flex-start;
            z-index: 60; background: white;
            padding: 24px 16px 32px; overflow-y: auto;
        }
        #allend-title {
            font-size: clamp(40px, 12vw, 80px);
            font-weight: bold; letter-spacing: 4px; color: #222; margin-top: 20px;
        }
        #allend-score { font-size: clamp(18px, 5vw, 32px); color: #555; margin: 16px 0; }
        #allend-back {
            padding: clamp(10px, 3vw, 15px) clamp(20px, 6vw, 40px);
            font-size: clamp(16px, 4vw, 20px);
            background: #007bff; color: white;
            border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;
        }
        #wrong-list-section { width: 100%; max-width: 600px; margin-top: 24px; text-align: left; }
        #wrong-list-title {
            font-size: clamp(16px, 4.5vw, 22px); font-weight: bold; color: #c0392b;
            margin-bottom: 12px; border-left: 5px solid #c0392b; padding-left: 10px;
        }
        .wrong-item {
            background: #fff5f5; border: 1px solid #f5c6cb;
            border-radius: 8px; padding: 10px 14px; margin-bottom: 10px;
        }
        .wrong-item .wi-mondai { font-size: clamp(12px, 3.2vw, 15px); color: #777; margin-bottom: 4px; }
        .wrong-item .wi-answer { font-size: clamp(13px, 3.5vw, 17px); font-weight: bold; color: #222; }
        .wrong-item .wi-answer span {
            background: #ffe0e0; border-radius: 4px; padding: 1px 5px; color: #c0392b;
        }

        /* 変換候補パネル */
        #henkan-panel {
            position: fixed;
            bottom: var(--keyboard-total);
            left: 0; width: 100%;
            background: #fff;
            border-top: 2px solid #007bff;
            display: none;
            flex-wrap: wrap;
            z-index: 20;
            max-height: 44px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
        }
        .henkan-item {
            display: inline-block;
            padding: 8px 14px;
            font-size: 16px;
            cursor: pointer;
            border-right: 1px solid #ddd;
            flex-shrink: 0;
        }
        .henkan-item:active, .henkan-item.selected {
            background: #007bff;
            color: white;
        }

        /* Shift mode indicator banner */
        #shift-banner {
            position: fixed;
            top: calc(100% - var(--keyboard-total) - 28px);
            left: 0; width: 100%; text-align: center;
            font-size: 12px; font-weight: bold; letter-spacing: 1px;
            padding: 3px 0;
            transition: all 0.15s;
            z-index: 5;
            display: none;
            pointer-events: none;
        }
        #shift-banner.mode-normal {
            background: #e0e0e0;
            color: #555;
        }
        #shift-banner.mode-shift {
            background: var(--shift-bg);
            color: #333;
        }

        /* ===== TAB & MEMO (Reaction mode only) ===== */
        #tab-header {
            position: fixed;
            bottom: var(--keyboard-total);
            left: 0;
            display: none;
            z-index: 110;
        }
        .tab-btn {
            padding: 4px 12px;
            font-size: 12px;
            border: 1px solid #999;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            background: #eee;
            cursor: pointer;
            color: #666;
        }
        .tab-btn.active {
            background: var(--bg-color);
            color: #000;
            font-weight: bold;
            border-color: #999;
        }

        #memo-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--keyboard-total);
            background: white;
            display: none;
            z-index: 105;
            flex-direction: column;
        }
        #memo-canvas {
            flex: 1;
            width: 100%;
            touch-action: none;
            cursor: crosshair;
        }
        #memo-tools {
            position: absolute;
            top: 5px;
            right: 10px;
            z-index: 120;
        }
        #memo-clear {
            padding: 4px 8px;
            font-size: 11px;
            background: #f8f9fa;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="allend-overlay">
    <div id="allend-title">ALL END</div>
    <div id="allend-score"></div>
    <button id="allend-back" onclick="goToStart()">トップへ戻る</button>
    <div id="wrong-list-section" style="display:none;">
        <div id="wrong-list-title">❌ 間違えた問題</div>
        <div id="wrong-list"></div>
    </div>
</div>

<div id="message-overlay">
    <div id="message-content"></div>
    <div id="message-sub"></div>
    <div id="gacha-result">
        <img id="gacha-img" src="">
        <div id="gacha-prob"></div>
    </div>
    <button id="gacha-btn" class="menu-btn" style="display:none; background:#ffc107; color:black;" onclick="pullGacha()">ガチャを引く！</button>
    <button id="mix-btn" class="menu-btn" style="display:none; background:#6f42c1; color:white;" onclick="mixGacha()">🔀 混ぜる</button>
    <button id="next-btn-manual" class="menu-btn" style="display:none; background:#28a745;" onclick="closeMessageAndNext()">次の問題</button>
</div>

<div id="start-screen" class="screen active-screen">
    <h1>Versionを選択</h1>
    <div id="ver-list">読み込み中...</div>
    <button id="admin-trigger" onclick="tryAdminAccess()">管理者</button>
</div>

<div id="order-screen" class="screen">
    <h2>出題順を選択</h2>
    <button class="menu-btn" onclick="setOrder('normal')">順番どおり</button>
    <button class="menu-btn" onclick="setOrder('random')">ランダム</button>
</div>

<div id="style-screen" class="screen">
    <h2>基本モードを選択</h2>
    <button class="menu-btn" onclick="setBaseStyle('once')">一周モード</button>
    <button class="menu-btn" onclick="setBaseStyle('retry')">克服モード</button>
</div>

<div id="substyle-screen" class="screen">
    <h2>付加機能を選択</h2>
    <button class="menu-btn" onclick="setFinalStyle('gacha')" style="background:#ffc107; color:black;">ガチャモード (4回正解でガチャ)</button>
    <button class="menu-btn" onclick="setFinalStyle('study')" style="background:#17a2b8;">勉強モード</button>
</div>

<div id="admin-screen" class="screen">
    <h2>ADMIN CONSOLE</h2>
    <div id="admin-console"></div>
    <input type="text" id="admin-input" placeholder="Type command..." onkeydown="processAdminCommand(event)">
</div>

<div id="henkan-panel"></div>

<div id="game-container">
    <div id="mondai-display"></div>
    <div id="answer-area"></div>
</div>

<!-- Tab Header (Reaction mode only) -->
<div id="tab-header">
    <button class="tab-btn active" id="tab-kbd" onclick="switchTab('keyboard')">キーボード</button>
    <button class="tab-btn" id="tab-memo" onclick="switchTab('memo')">メモ</button>
</div>

<!-- Memo Container (Reaction mode only) -->
<div id="memo-container">
    <div id="memo-tools">
        <button id="memo-clear" onclick="clearMemo()">クリア</button>
    </div>
    <canvas id="memo-canvas"></canvas>
</div>

<!-- Shift mode banner -->
<div id="shift-banner" class="mode-normal">通常モード　a-z / ₁-₉</div>

<div class="keyboard" id="main-keyboard">
    <!-- Number row -->
    <div class="row" id="num-row">
        <button class="key key-num" id="num-1" data-key="1" onclick="handleInput('1')">
            <span class="key-main" id="nkd-1">₁</span>
        </button>
        <button class="key key-num" id="num-2" data-key="2" onclick="handleInput('2')">
            <span class="key-main" id="nkd-2">₂</span>
        </button>
        <button class="key key-num" id="num-3" data-key="3" onclick="handleInput('3')">
            <span class="key-main" id="nkd-3">₃</span>
        </button>
        <button class="key key-num" id="num-4" data-key="4" onclick="handleInput('4')">
            <span class="key-main" id="nkd-4">₄</span>
        </button>
        <button class="key key-num" id="num-5" data-key="5" onclick="handleInput('5')">
            <span class="key-main" id="nkd-5">₅</span>
        </button>
        <button class="key key-num" id="num-6" data-key="6" onclick="handleInput('6')">
            <span class="key-main" id="nkd-6">₆</span>
        </button>
        <button class="key key-num" id="num-7" data-key="7" onclick="handleInput('7')">
            <span class="key-main" id="nkd-7">₇</span>
        </button>
        <button class="key key-num" id="num-8" data-key="8" onclick="handleInput('8')">
            <span class="key-main" id="nkd-8">₈</span>
        </button>
        <button class="key key-num" id="num-9" data-key="9" onclick="handleInput('9')">
            <span class="key-main" id="nkd-9">₉</span>
        </button>
    </div>
    <!-- Row 1: Q-P -->
    <div class="row">
        <button class="key" data-key="q" onclick="handleInput('q')"><span class="key-main" id="kd-q">q</span></button>
        <button class="key" data-key="w" onclick="handleInput('w')"><span class="key-main" id="kd-w">w</span></button>
        <button class="key" data-key="e" onclick="handleInput('e')"><span class="key-main" id="kd-e">e</span></button>
        <button class="key" data-key="r" onclick="handleInput('r')"><span class="key-main" id="kd-r">r</span></button>
        <button class="key" data-key="t" onclick="handleInput('t')"><span class="key-main" id="kd-t">t</span></button>
        <button class="key" data-key="y" onclick="handleInput('y')"><span class="key-main" id="kd-y">y</span></button>
        <button class="key" data-key="u" onclick="handleInput('u')"><span class="key-main" id="kd-u">u</span></button>
        <button class="key" data-key="i" onclick="handleInput('i')"><span class="key-main" id="kd-i">i</span></button>
        <button class="key" data-key="o" onclick="handleInput('o')"><span class="key-main" id="kd-o">o</span></button>
        <button class="key" data-key="p" onclick="handleInput('p')"><span class="key-main" id="kd-p">p</span></button>
    </div>
    <!-- Row 2: A-L -->
    <div class="row">
        <button class="key" data-key="a" onclick="handleInput('a')"><span class="key-main" id="kd-a">a</span></button>
        <button class="key" data-key="s" onclick="handleInput('s')"><span class="key-main" id="kd-s">s</span></button>
        <button class="key" data-key="d" onclick="handleInput('d')"><span class="key-main" id="kd-d">d</span></button>
        <button class="key" data-key="f" onclick="handleInput('f')"><span class="key-main" id="kd-f">f</span></button>
        <button class="key" data-key="g" onclick="handleInput('g')"><span class="key-main" id="kd-g">g</span></button>
        <button class="key" data-key="h" onclick="handleInput('h')"><span class="key-main" id="kd-h">h</span></button>
        <button class="key" data-key="j" onclick="handleInput('j')"><span class="key-main" id="kd-j">j</span></button>
        <button class="key" data-key="k" onclick="handleInput('k')"><span class="key-main" id="kd-k">k</span></button>
        <button class="key" data-key="l" onclick="handleInput('l')"><span class="key-main" id="kd-l">l</span></button>
    </div>
    <!-- Row 3: Shift, Z-M, Backspace -->
    <div class="row">
        <button class="key key-special" data-key="Shift" id="shift-key" onclick="handleInput('Shift')">Shift</button>
        <button class="key" data-key="z" onclick="handleInput('z')"><span class="key-main" id="kd-z">z</span></button>
        <button class="key" data-key="x" onclick="handleInput('x')"><span class="key-main" id="kd-x">x</span></button>
        <button class="key" data-key="c" onclick="handleInput('c')"><span class="key-main" id="kd-c">c</span></button>
        <button class="key" data-key="v" onclick="handleInput('v')"><span class="key-main" id="kd-v">v</span></button>
        <button class="key" data-key="b" onclick="handleInput('b')"><span class="key-main" id="kd-b">b</span></button>
        <button class="key" data-key="n" onclick="handleInput('n')"><span class="key-main" id="kd-n">n</span></button>
        <button class="key" data-key="m" onclick="handleInput('m')"><span class="key-main" id="kd-m">m</span></button>
        <button class="key key-special" data-key="Backspace" onclick="handleInput('Backspace')">⌫</button>
    </div>
    <!-- Row 4: →, ;(+), Space, Enter -->
    <div class="row">
        <button class="key key-wide" data-key="ArrowRight" onclick="handleInput('ArrowRight')">→</button>
        <button class="key key-wide" data-key=";" onclick="handleInput(';')">+</button>
        <button class="key key-space" data-key=" " id="space-key" onclick="handleInput(' ')">Space</button>
        <button class="key key-special" data-key="Enter" onclick="handleInput('Enter')">Enter</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBThej0xTpO6eBOHhpXxaJHgPzpdekXvFM",
        authDomain: "genso-daa6d.firebaseapp.com",
        databaseURL: "https://genso-daa6d-default-rtdb.firebaseio.com",
        projectId: "genso-daa6d",
        storageBucket: "genso-daa6d.firebasestorage.app",
        messagingSenderId: "218450334268",
        appId: "1:218450334268:web:37590aa47de792b5c4e939",
        measurementId: "G-GP4NJH14VY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef   = ref(db, 'mondaiData');
    const rootRef = ref(db, '/');

    window.rawMondai = [];
    window.rawKotaeGroups = [];
    window.hani_end = [];
    window.kaitouran = [];
    window.adminPass = null;

    onValue(rootRef, (snapshot) => {
        const root = snapshot.val() || {};
        const data = root.mondaiData || {};
        window.rawMondai      = data.mondai    || [];
        window.rawKotaeGroups = data.kotae     || [];
        window.hani_end       = data.hani      || [];
        window.kaitouran      = data.kaitouran || [];
        if (root.pass !== undefined && root.pass !== null) {
            window.adminPass = root.pass;
        } else if (data.pass !== undefined && data.pass !== null) {
            window.adminPass = data.pass;
        } else {
            window.adminPass = null;
        }
        renderVerList();
    });

    window.saveToFirebase = function() {
        set(dbRef, {
            mondai:    window.rawMondai,
            kotae:     window.rawKotaeGroups,
            hani:      window.hani_end,
            kaitouran: window.kaitouran
        }).then(() => console.log("Cloud Updated!"));
    };
</script>

<script>
    // ===== State =====
    let playStyle = 'once', subStyle = 'gacha', playOrder = 'normal';
    let currentPool = [], currentPos = 0;
    let inputs = [], activeInputIdx = 0;
    let isShift = false;
    let isZenkaku = false;
    let isZenkakuFixed = false;
    let romaBuffer = '';
    let henkanMode = false;
    let henkanBase = '';
    let henkanList = [];
    let henkanIdx  = 0;
    let isWaiting = false;
    let correctCount = 0, totalQuestions = 0;
    let retryPool = [], wrongAnswers = [];
    let selectedVerIdx = 0;
    const ZENKAKU_FIXED_VERS = new Set([1, 3]);
    const SUB_DIGITS = ['₁','₂','₃','₄','₅','₆','₇','₈','₉'];
    const NRM_DIGITS = ['1','2','3','4','5','6','7','8','9'];
    const GACHA_TABLE = [
        { src: "nso/Co_transparent.png", prob: 40 },
        { src: "nso/Eo_transparent.png", prob: 40 },
        { src: "nso/Ao_transparent.png", prob: 10 },
        { src: "nso/Do_transparent.png", prob: 8  },
        { src: "nso/Bo_transparent.png", prob: 2  }
    ];

    // ===== MEMO CANVAS =====
    let memoCanvas, memoCtx, isDrawing = false;
    function initMemo() {
        memoCanvas = document.getElementById('memo-canvas');
        memoCtx = memoCanvas.getContext('2d');
        const resize = () => {
            const container = document.getElementById('memo-container');
            if (container.clientWidth > 0) {
                memoCanvas.width = container.clientWidth;
                memoCanvas.height = container.clientHeight;
            }
        };
        window.addEventListener('resize', resize);
        resize();

        const start = (e) => { isDrawing = true; draw(e); };
        const end = () => { isDrawing = false; memoCtx.beginPath(); };
        const draw = (e) => {
            if (!isDrawing) return;
            const rect = memoCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            memoCtx.lineWidth = 2;
            memoCtx.lineCap = 'round';
            memoCtx.strokeStyle = 'black';
            memoCtx.lineTo(clientX - rect.left, clientY - rect.top);
            memoCtx.stroke();
            memoCtx.beginPath();
            memoCtx.moveTo(clientX - rect.left, clientY - rect.top);
        };
        memoCanvas.addEventListener('mousedown', start);
        memoCanvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', end);
        memoCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); }, {passive:false});
        memoCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, {passive:false});
        window.addEventListener('touchend', end);
    }
    function clearMemo() { memoCtx.clearRect(0, 0, memoCanvas.width, memoCanvas.height); }

    function switchTab(type) {
        const kbd = document.getElementById('main-keyboard');
        const memo = document.getElementById('memo-container');
        const tabKbd = document.getElementById('tab-kbd');
        const tabMemo = document.getElementById('tab-memo');
        if (type === 'keyboard') {
            kbd.style.display = 'block'; memo.style.display = 'none';
            tabKbd.classList.add('active'); tabMemo.classList.remove('active');
        } else {
            kbd.style.display = 'none'; memo.style.display = 'flex';
            tabKbd.classList.remove('active'); tabMemo.classList.add('active');
            if (!memoCanvas) initMemo();
        }
    }

    // ===== Keyboard display update =====
    function updateKeyboardDisplay() {
        const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
        letters.forEach(c => {
            const el = document.getElementById(`kd-${c}`);
            if (el) el.textContent = isShift ? c.toUpperCase() : c;
        });
        const shiftKey = document.getElementById('shift-key');
        if (isShift) { shiftKey.classList.add('shift-active'); }
        else { shiftKey.classList.remove('shift-active'); }
        for (let i = 1; i <= 9; i++) {
            const el = document.getElementById(`nkd-${i}`);
            if (el) el.textContent = isShift ? String(i) : SUB_DIGITS[i - 1];
            const btn = document.getElementById(`num-${i}`);
            if (btn) btn.classList.remove('key-disabled');
        }
        const banner = document.getElementById('shift-banner');
        if (isShift) {
            banner.className = 'mode-shift';
            banner.textContent = 'Shiftモード　A-Z / 1-9';
        } else {
            banner.className = 'mode-normal';
            banner.textContent = '通常モード　a-z / ₁-₉';
        }
        const spaceKey = document.getElementById('space-key');
        if (spaceKey) { spaceKey.textContent = isZenkakuFixed ? '文字変換' : 'Space'; }
    }

    function flashKey(key) {
        if (key === 'Shift') return;
        let selector;
        if (/^[1-9]$/.test(key)) { selector = `#num-${key}`; }
        else { selector = `.key[data-key="${CSS.escape(key)}"]`; }
        const btn = document.querySelector(selector);
        if (!btn || btn.classList.contains('key-disabled')) return;
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 150);
    }

    const ROMA_TABLE = [
        ['xtsu','っ'],['ltsu','っ'],['chi','ち'],['tsu','つ'],['sha','しゃ'],['shi','し'],['shu','しゅ'],['sho','しょ'],
        ['tya','ちゃ'],['tu','つ'],['tyu','ちゅ'],['tye','ちぇ'],['tyo','ちょ'],['cha','ちゃ'],['chu','ちゅ'],['cho','ちょ'],['che','ちぇ'],
        ['dya','ぢゃ'],['dyu','ぢゅ'],['dyo','ぢょ'],['nya','にゃ'],['nyu','にゅ'],['nyo','にょ'],['hya','ひゃ'],['hyu','ひゅ'],['hyo','ひょ'],
        ['mya','みゃ'],['myu','みゅ'],['myo','みょ'],['rya','りゃ'],['ryu','りゅ'],['ryo','りょ'],['gya','ぎゃ'],['gyu','ぎゅ'],['gyo','ぎょ'],
        ['bya','びゃ'],['byu','びゅ'],['byo','びょ'],['pya','ぴゃ'],['pyu','ぴゅ'],['pyo','ぴょ'],['kya','きゃ'],['kyu','きゅ'],['kyo','きょ'],
        ['sya','しゃ'],['syu','しゅ'],['syo','しょ'],['zya','じゃ'],['zyu','じゅ'],['zyo','じょ'],['ja' ,'じゃ'],['ju' ,'じゅ'],['jo' ,'じょ'],['je','じぇ'],
        ['dzu','づ'],['ka','か'],['ki','き'],['ku','く'],['ke','け'],['ko','こ'],['sa','さ'],['si','し'],['su','す'],['se','せ'],['so','そ'],
        ['ta','た'],['ti','ち'],['te','て'],['to','と'],['na','な'],['ni','に'],['nu','ぬ'],['ne','ね'],['no','の'],['ha','は'],['hi','ひ'],['hu','ふ'],['he','へ'],['ho','ほ'],
        ['ma','ま'],['mi','み'],['mu','む'],['me','め'],['mo','も'],['ya','や'],['yu','ゆ'],['yo','よ'],['ra','ら'],['ri','り'],['ru','る'],['re','れ'],['ro','ろ'],
        ['wa','わ'],['wi','ゐ'],['we','ゑ'],['wo','を'],['ga','が'],['gi','ぎ'],['gu','ぐ'],['ge','げ'],['go','ご'],['za','ざ'],['zi','じ'],['zu','ず'],['ze','ぜ'],['zo','ぞ'],
        ['da','だ'],['di','ぢ'],['du','づ'],['de','で'],['do','ど'],['ba','ば'],['bi','び'],['bu','ぶ'],['be','べ'],['bo','ぼ'],['pa','ぱ'],['pi','ぴ'],['pu','ぷ'],['pe','ぺ'],['po','ぽ'],
        ['fa','ふぁ'],['fi','ふぃ'],['fu','ふ'],['fe','ふぇ'],['fo','ふぉ'],['xa','ぁ'],['xi','ぃ'],['xu','ぅ'],['xe','ぇ'],['xo','ぉ'],['xya','ゃ'],['xyu','ゅ'],['xyo','ょ'],['xtu','っ'],
        ['la','ぁ'],['li','ぃ'],['lu','ぅ'],['le','ぇ'],['lo','ぉ'],['lya','ゃ'],['lyu','ゅ'],['lyo','ょ'],['ltu','っ'],['ji','じ'],['ju','じゅ'],['va','ヴぁ'],['vi','ヴぃ'],['vu','ヴ'],['ve','ヴぇ'],['vo','ヴぉ'],
        ['a','あ'],['i','い'],['u','う'],['e','え'],['o','お'],
    ];

    function tryConvertRoma(buf) {
        if (buf.length >= 2 && buf[0] === buf[1] && buf[0] !== 'n') { return { out: 'っ', rest: buf.slice(1) }; }
        for (const [roma, hira] of ROMA_TABLE) { if (buf.startsWith(roma)) return { out: hira, rest: buf.slice(roma.length) }; }
        if (buf.length >= 5) return { out: buf[0], rest: buf.slice(1) };
        return null;
    }

    function flushRomaBuffer(forceFlush) {
        let result = '';
        if (romaBuffer === 'n') { if (forceFlush) { result = 'ん'; romaBuffer = ''; } }
        else {
            const res = tryConvertRoma(romaBuffer);
            if (res) {
                result = res.out; romaBuffer = res.rest;
                if (romaBuffer.length > 0) result += flushRomaBuffer(false);
            }
        }
        return result;
    }

    function inputRomaChar(c) {
        const letter = c.toLowerCase(); const isVowel = 'aiueo'.includes(letter);
        if (romaBuffer === 'n') {
            if (letter === 'n') { inputs[activeInputIdx] += 'ん'; romaBuffer = ''; updateDisplay(); return; }
            else if (!isVowel) { inputs[activeInputIdx] += 'ん'; romaBuffer = ''; }
        }
        romaBuffer += letter; let converted = '';
        while (romaBuffer.length > 0) {
            const res = tryConvertRoma(romaBuffer);
            if (res) { converted += res.out; romaBuffer = res.rest; } else break;
        }
        if (converted) inputs[activeInputIdx] += converted;
    }

    async function fetchHenkan(hiragana) {
        try {
            const url = `https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(hiragana + ',')}`;
            const res = await fetch(url); const json = await res.json();
            const candidates = [];
            json.forEach(seg => { if (seg[1]) seg[1].forEach(c => { if (!candidates.includes(c)) candidates.push(c); }); });
            return candidates.length > 0 ? candidates : [hiragana];
        } catch(e) { return [hiragana]; }
    }

    function showHenkanPanel(candidates, base) {
        henkanMode = true; henkanList = candidates; henkanBase = base; henkanIdx  = 0;
        const panel = document.getElementById('henkan-panel'); panel.innerHTML = '';
        candidates.forEach((c, i) => {
            const el = document.createElement('div'); el.className = 'henkan-item' + (i === 0 ? ' selected' : ''); el.textContent = c;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); selectHenkan(i); }, {passive: false});
            el.addEventListener('mousedown',  (e) => { e.preventDefault(); selectHenkan(i); });
            panel.appendChild(el);
        });
        panel.style.display = 'flex';
    }

    function selectHenkan(idx) {
        const chosen = henkanList[idx]; const cur = inputs[activeInputIdx];
        if (cur.endsWith(henkanBase)) inputs[activeInputIdx] = cur.slice(0, cur.length - henkanBase.length) + chosen;
        else inputs[activeInputIdx] += chosen;
        closeHenkanPanel(); updateDisplay();
    }

    function closeHenkanPanel() {
        henkanMode = false; henkanList = []; henkanBase = ''; henkanIdx  = 0;
        const panel = document.getElementById('henkan-panel'); panel.style.display = 'none'; panel.innerHTML = '';
    }

    function getTrailingHiragana(str) { const m = str.match(/[\u3041-\u3096ー]+$/); return m ? m[0] : ''; }

    function handleInput(key) {
        if (isWaiting) return;
        if (document.getElementById('admin-screen').classList.contains('active-screen')) return;
        if (document.getElementById('game-container').style.display !== 'flex') return;
        if (key === 'Shift') { isShift = !isShift; updateKeyboardDisplay(); return; }
        if (key === 'Zenkaku') { if (isZenkakuFixed) return; isZenkaku = !isZenkaku; romaBuffer = ''; updateKeyboardDisplay(); return; }
        flashKey(key);
        if (key === 'Backspace') {
            if (henkanMode) { closeHenkanPanel(); updateDisplay(); return; }
            if (isZenkaku && romaBuffer.length > 0) romaBuffer = romaBuffer.slice(0, -1);
            else if (inputs[activeInputIdx] === '') { if (activeInputIdx > 0) activeInputIdx--; }
            else inputs[activeInputIdx] = inputs[activeInputIdx].slice(0, -1);
        } else if (key === 'Enter') {
            if (henkanMode) { selectHenkan(henkanIdx); return; }
            if (isZenkaku && romaBuffer.length > 0) {
                const flushed = flushRomaBuffer(true); if (flushed) inputs[activeInputIdx] += flushed;
                romaBuffer = '';
            }
            if (inputs.length > 1 && activeInputIdx < inputs.length - 1) activeInputIdx++;
            else checkAnswer();
        } else if (key === ' ') {
            if (isZenkaku) {
                if (romaBuffer.length > 0) {
                    const flushed = flushRomaBuffer(true); if (flushed) inputs[activeInputIdx] += flushed;
                    romaBuffer = ''; updateDisplay();
                }
                if (henkanMode) {
                    henkanIdx = (henkanIdx + 1) % henkanList.length;
                    document.querySelectorAll('.henkan-item').forEach((el, i) => el.classList.toggle('selected', i === henkanIdx));
                } else {
                    const hira = getTrailingHiragana(inputs[activeInputIdx]);
                    if (hira.length > 0) fetchHenkan(hira).then(candidates => { showHenkanPanel(candidates, hira); updateDisplay(); });
                }
                return;
            }
            inputs[activeInputIdx] += ' '; if (activeInputIdx < inputs.length - 1) activeInputIdx++;
        } else if (key === 'ArrowRight') {
            if (isZenkaku && romaBuffer.length > 0) {
                const flushed = flushRomaBuffer(true); if (flushed) inputs[activeInputIdx] += flushed;
                romaBuffer = '';
            }
            if (activeInputIdx < inputs.length - 1) activeInputIdx++;
        } else if (/^[a-z]$/i.test(key)) {
            if (isZenkaku) inputRomaChar(key);
            else inputs[activeInputIdx] += isShift ? key.toUpperCase() : key;
        } else if (/^[0-9]$/.test(key)) {
            if (isShift) inputs[activeInputIdx] += key;
            else inputs[activeInputIdx] += SUB_DIGITS[parseInt(key) - 1];
        } else if (key === ';') inputs[activeInputIdx] += '+';
        updateDisplay();
    }

    function updateDisplay() {
        inputs.forEach((v, i) => {
            const b = document.getElementById(`box-${i}`); if (!b) return;
            b.classList.remove('active-box'); b.innerHTML = '';
            if (i === activeInputIdx) {
                b.classList.add('active-box'); b.style.color = '#007bff';
                const confirmed = document.createElement('span'); confirmed.textContent = v.replace(/ /g, ' '); b.appendChild(confirmed);
                if (isZenkaku && romaBuffer.length > 0) {
                    const pending = document.createElement('span'); pending.textContent = romaBuffer;
                    pending.style.cssText = 'text-decoration: underline; color: #0056b3; font-style: italic;';
                    b.appendChild(pending);
                }
                const cursor = document.createElement('span'); cursor.className = 'cursor'; b.appendChild(cursor);
            } else {
                b.style.color = v ? '#333' : '#ccc'; b.innerText = (v || '').replace(/ /g, ' ');
            }
        });
    }

    function resolveQuestion(idx) {
        if (idx < 0 || idx >= window.rawMondai.length) return { mondai: '?', kotae: ['?'], kaitouran: '()' };
        let mondai = window.rawMondai[idx];
        let kotaeGroup = window.rawKotaeGroups[idx] || [];
        let kotae = Array.isArray(kotaeGroup) ? kotaeGroup : [kotaeGroup];
        const kaitouran = window.kaitouran[idx] || '()';
        const verStart = selectedVerIdx === 0 ? 0 : (window.hani_end[selectedVerIdx - 1] + 1);
        const relativeIdx = idx - verStart;
        for (const [v1, v2] of CHANGE_PAIRS) {
            if (selectedVerIdx === v1 || selectedVerIdx === v2) {
                const targetVer = selectedVerIdx === v1 ? v2 : v1;
                const pairStart = targetVer === 0 ? 0 : (window.hani_end[targetVer - 1] + 1);
                const pairIdx = pairStart + relativeIdx;
                const pairKotaeGroup = window.rawKotaeGroups[pairIdx] || [];
                const pairKotae = Array.isArray(pairKotaeGroup) ? pairKotaeGroup : [pairKotaeGroup];
                if (mondai === 'change') {
                    mondai = pairKotae.join('');
                    kotae = pairKotae;
                } else if (kotae.includes('change')) {
                    mondai = pairKotae.join('');
                    kotae = [window.rawMondai[pairIdx] || '?'];
                }
            }
        }
        return { mondai, kotae, kaitouran };
    }

    function checkAnswer() {
        const idx = currentPool[currentPos];
        const { mondai: mondaiText, kotae: ans, kaitouran: template } = resolveQuestion(idx);
        const ok = inputs.every((v, i) => v.trim() === (ans[i] || ''));
        const parts = template.split('()');
        let correctSentence = '';
        parts.forEach((pt, i) => {
            correctSentence += pt;
            if (i < parts.length - 1) correctSentence += `(${ans[i] || ''})`;
        });
        if (ok) {
            if (subStyle === 'gacha') {
                correctCount++;
                if (correctCount >= 4) {
                    correctCount = 0;
                    showMsg('正解！', 'green', null, '4回正解達成！おめでと！', true);
                    return;
                }
            }
            showMsg('正解', 'green', () => next());
        } else {
            if (playStyle === 'retry') retryPool.push(idx);
            wrongAnswers.push({ mondai: mondaiText, answer: correctSentence });
            showMsg('不正解', 'red', null, `正解: ${correctSentence}`);
        }
    }

    function showMsg(m, c, cb, sub = '', gachaReady = false) {
        isWaiting = true;
        document.getElementById('main-keyboard').style.display = 'none';
        document.getElementById('tab-header').style.display = 'none';
        document.getElementById('memo-container').style.display = 'none';
        document.getElementById('shift-banner').style.display = 'none';
        const o = document.getElementById('message-overlay');
        document.getElementById('message-content').innerText = m;
        document.getElementById('message-content').style.color = c;
        document.getElementById('message-sub').innerText = sub;
        document.getElementById('gacha-result').style.display = 'none';
        const gBtn = document.getElementById('gacha-btn'); const nBtn = document.getElementById('next-btn-manual'); const mBtn = document.getElementById('mix-btn');
        if (gachaReady) { gBtn.style.display = 'block'; mBtn.style.display = 'block'; nBtn.style.display = 'none'; }
        else { gBtn.style.display = 'none'; mBtn.style.display = 'none'; nBtn.style.display = cb ? 'none' : 'block'; }
        o.style.display = 'flex';
        if (cb) setTimeout(() => {
            o.style.display = 'none'; isWaiting = false;
            document.getElementById('main-keyboard').style.display = 'block';
            document.getElementById('shift-banner').style.display = 'block';
            if (selectedVerIdx === 4) document.getElementById('tab-header').style.display = 'block';
            cb();
        }, 1000);
    }

    function pullGacha() {
        const rand = Math.random() * 100;
        let sum = 0, selected = GACHA_TABLE[0];
        for (const item of GACHA_TABLE) { sum += item.prob; if (rand < sum) { selected = item; break; } }
        document.getElementById('gacha-btn').style.display = 'none';
        document.getElementById('mix-btn').style.display = 'none';
        const res = document.getElementById('gacha-result');
        document.getElementById('gacha-img').src = selected.src;
        document.getElementById('gacha-prob').innerText = `出現確率: ${selected.prob}%`;
        res.style.display = 'block';
        document.getElementById('next-btn-manual').style.display = 'block';
    }

    function mixGacha() {
        document.getElementById('gacha-btn').style.display = 'none'; document.getElementById('mix-btn').style.display = 'none';
        setTimeout(() => { document.getElementById('gacha-btn').style.display = 'block'; document.getElementById('mix-btn').style.display = 'block'; }, 300);
    }

    function next() {
        currentPos++;
        if (currentPos >= currentPool.length) {
            if (playStyle === 'retry' && retryPool.length > 0) {
                currentPool = [...retryPool]; retryPool = [];
                if (playOrder === 'random') currentPool.sort(() => Math.random() - 0.5);
                currentPos = 0; loadQuestion();
            } else { showAllEnd(); }
        } else { loadQuestion(); }
    }

    function showAllEnd() {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('main-keyboard').style.display = 'none';
        document.getElementById('shift-banner').style.display = 'none';
        document.getElementById('tab-header').style.display = 'none';
        document.getElementById('memo-container').style.display = 'none';
        const scoreEl = document.getElementById('allend-score');
        if (playStyle === 'once') { scoreEl.innerText = `${totalQuestions - wrongAnswers.length} / ${totalQuestions} 問正解`; }
        else { scoreEl.innerText = '全問正解！'; }
        const section = document.getElementById('wrong-list-section'); const listEl = document.getElementById('wrong-list');
        listEl.innerHTML = '';
        if (wrongAnswers.length > 0) {
            section.style.display = 'block';
            wrongAnswers.forEach((item, i) => {
                const div = document.createElement('div'); div.className = 'wrong-item';
                const highlighted = item.answer.replace(/\(([^)]*)\)/g, '(<span>$1</span>)');
                div.innerHTML = `<div class="wi-mondai">Q${i+1}. ${item.mondai}</div><div class="wi-answer">正解: ${highlighted}</div>`;
                listEl.appendChild(div);
            });
        } else { section.style.display = 'none'; }
        document.getElementById('allend-overlay').style.display = 'flex';
    }

    function goToStart() { document.getElementById('allend-overlay').style.display = 'none'; showScreen('start-screen'); }
    
    function closeMessageAndNext() {
        document.getElementById('message-overlay').style.display = 'none'; isWaiting = false;
        document.getElementById('main-keyboard').style.display = 'block';
        document.getElementById('shift-banner').style.display = 'block';
        if (selectedVerIdx === 4) { document.getElementById('tab-header').style.display = 'block'; switchTab('keyboard'); }
        next();
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('main-keyboard').style.display = 'none';
        document.getElementById('shift-banner').style.display = 'none';
        if (id) document.getElementById(id).classList.add('active-screen');
    }

    function renderVerList() {
        const listEl = document.getElementById('ver-list'); if (!listEl) return;
        listEl.innerHTML = ''; const count = Math.min(window.hani_end.length, 5);
        for (let i = 0; i < count; i++) {
            const val = window.hani_end[i]; const btn = document.createElement('button'); btn.className = 'menu-btn';
            btn.innerText = VER_LABELS[i] || `Ver.${i + 1}`;
            btn.onclick = () => {
                selectedVerIdx = i; const start = i === 0 ? 0 : window.hani_end[i-1] + 1;
                currentPool = Array.from({length: val - start + 1}, (_, k) => k + start);
                showScreen('order-screen');
            };
            listEl.appendChild(btn);
        }
    }

    function setOrder(o) { playOrder = o; showScreen('style-screen'); }
    function setBaseStyle(s) { playStyle = s; showScreen('substyle-screen'); }
    function setFinalStyle(s) { subStyle = s; correctCount = 0; startGame(); }

    function startGame() {
        currentPos = 0; correctCount = 0; totalQuestions = 0; retryPool = []; wrongAnswers = [];
        if (playOrder === 'random') currentPool.sort(() => Math.random() - 0.5);
        totalQuestions = currentPool.length;
        showScreen('');
        document.getElementById('game-container').style.display = 'flex';
        document.getElementById('main-keyboard').style.display = 'block';
        document.getElementById('shift-banner').style.display = 'block';
        if (selectedVerIdx === 4) { document.getElementById('tab-header').style.display = 'block'; switchTab('keyboard'); }
        else { document.getElementById('tab-header').style.display = 'none'; document.getElementById('memo-container').style.display = 'none'; }
        isZenkakuFixed = ZENKAKU_FIXED_VERS.has(selectedVerIdx); isZenkaku = isZenkakuFixed; isShift = false; romaBuffer = '';
        closeHenkanPanel(); updateKeyboardDisplay(); loadQuestion();
    }

    function loadQuestion() {
        const idx = currentPool[currentPos]; const { mondai, kotae: ans, kaitouran: template } = resolveQuestion(idx);
        document.getElementById('mondai-display').innerText = mondai;
        const area = document.getElementById('answer-area'); area.innerHTML = '';
        const parts = template.split('()'); inputs = new Array(parts.length - 1).fill(''); activeInputIdx = 0;
        parts.forEach((pt, i) => {
            if (pt !== '') { const span = document.createElement('span'); span.innerText = pt; area.appendChild(span); }
            if (i < parts.length - 1) {
                const b = document.createElement('div'); b.className = 'input-box'; b.id = `box-${i}`;
                const ansLen = (ans[i] || '').length; if (ansLen > 0) b.style.minWidth = Math.max(50, ansLen * 14) + 'px';
                area.appendChild(b);
            }
        });
        updateDisplay();
    }

    const VER_LABELS = ['元素記号を答える','元素名を答える','分子名を化学式で答える','化学式を分子名で答える','反応を化学式で答える'];
    const CHANGE_PAIRS = [[0,1],[2,3]];
    
    function tryAdminAccess() {
        const entered = prompt('Pass?'); if (entered === null) return;
        const stored = String(window.adminPass ?? '');
        if (entered === stored) { showScreen('admin-screen'); }
        else { alert(`NG（DB値: "${stored}"）`); }
    }
    function logAdmin(t) { const c = document.getElementById('admin-console'); c.innerText += t + '\n'; c.scrollTop = c.scrollHeight; }
    function getListByName(name) {
        if (name === 'mondai')    return window.rawMondai; if (name === 'kotae')     return window.rawKotaeGroups;
        if (name === 'hani')      return window.hani_end; if (name === 'kaitouran') return window.kaitouran;
        return null;
    }
    function processAdminCommand(e) {
        if (e.key !== 'Enter') return;
        const input = document.getElementById('admin-input'); const full = input.value.trim(); input.value = '';
        if (!full) return; logAdmin('> ' + full);
        const p = full.match(/(".*?"|[^"\s]+)/g)?.map(x => x.replace(/"/g, '')) || []; const cmd = p[0]?.toLowerCase();
        if (cmd === 'exit') showScreen('start-screen');
        else if (cmd === 'setpass') {
            const newPass = p[1]; if (!newPass) return logAdmin('Usage: setpass <新しいパスワード>');
            window.adminPass = newPass; window.saveToFirebase(); logAdmin(`パスワードを「${newPass}」に更新しました。`);
        }
        else if (cmd === 'show') {
            const listName = p[1]?.toLowerCase();
            if (listName === 'all') logAdmin(`Sizes: mondai:${window.rawMondai.length}, kotae:${window.rawKotaeGroups.length}, hani:${window.hani_end.length}, kaitouran:${window.kaitouran.length}`);
            else {
                const list = getListByName(listName);
                if (list) list.forEach((v, i) => logAdmin(`[${i}] ${Array.isArray(v)?v.join(','):v}`));
                else logAdmin('Lists: mondai, kotae, hani, kaitouran');
            }
        }
        else if (cmd === 'add') {
            const listName = p[2]?.toLowerCase();
            if (listName === 'all') {
                const mondaiData = p[3], kotaeData = p[4] ? p[4].split(',') : [], kaitouranData = p[5];
                if (!mondaiData || !kotaeData.length || !kaitouranData) return logAdmin('Usage: add <idx/f> all <mondai> <kotae> <kaitouran>');
                const idxM = p[1]==='f' ? window.rawMondai.length : parseInt(p[1]);
                window.rawMondai.splice(idxM, 0, mondaiData); window.rawKotaeGroups.splice(idxM, 0, kotaeData); window.kaitouran.splice(idxM, 0, kaitouranData);
                logAdmin(`Added all [${idxM}]`); window.saveToFirebase();
            } else {
                const list = getListByName(listName); if (!list) return logAdmin('Error: List not found.');
                const idx = p[1]==='f' ? list.length : parseInt(p[1]);
                let data = p[3]; if (listName==='kotae') data = data.split(','); if (listName==='hani') data = parseInt(data);
                list.splice(idx, 0, data); logAdmin(`Added to ${listName} at [${idx}]`); window.saveToFirebase();
            }
        }
        else if (cmd === 'replace') {
            const listName = p[2]?.toLowerCase();
            if (listName === 'all') {
                const mondaiData = p[3], kotaeData = p[4]?p[4].split(','):[], kaitouranData = p[5];
                if (!mondaiData||!kotaeData.length||!kaitouranData) return logAdmin('Usage: replace <idx/f> all <mondai> <kotae> <kaitouran>');
                const idxM = p[1]==='f' ? window.rawMondai.length-1 : parseInt(p[1]);
                window.rawMondai[idxM] = mondaiData; window.rawKotaeGroups[idxM] = kotaeData; window.kaitouran[idxM] = kaitouranData;
                logAdmin(`Replaced all [${idxM}]`); window.saveToFirebase();
            } else {
                const list = getListByName(listName); if (!list) return logAdmin('Error: List not found.');
                const idx = p[1]==='f' ? list.length-1 : parseInt(p[1]);
                let data = p[3]; if (listName==='kotae') data = data.split(','); if (listName==='hani') data = parseInt(data);
                list[idx] = data; logAdmin(`Replaced ${listName} [${idx}]`); window.saveToFirebase();
            }
        }
        else if (cmd === 'remove') {
            const listName = p[2]?.toLowerCase();
            if (listName === 'all') {
                const idxM = p[1]==='f' ? window.rawMondai.length-1 : parseInt(p[1]);
                window.rawMondai.splice(idxM,1); window.rawKotaeGroups.splice(idxM,1); window.kaitouran.splice(idxM,1);
                logAdmin(`Removed all [${idxM}]`); window.saveToFirebase();
            } else {
                const list = getListByName(listName); if (!list||list.length===0) return logAdmin('Error: List empty or not found.');
                const idx = p[1]==='f' ? list.length-1 : parseInt(p[1]);
                list.splice(idx,1); logAdmin(`Removed from ${listName} [${idx}]`); window.saveToFirebase();
            }
        }
    }

    const ALLOWED_PHYSICAL = new Set(['a','b','c','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r','s','t','u','v','w','x','y','z','1','2','3','4','5','6','7','8','9','Enter','Backspace','Shift','ArrowRight',';',' ']);
    window.addEventListener('keydown', (e) => {
        if (document.activeElement.id === 'admin-input') return;
        let key = e.key;
        if (key === 'Zenkaku' || key === 'Hankaku' || key === 'ZenkakuHankaku' || key === 'KanaMode') { e.preventDefault(); handleInput('Zenkaku'); return; }
        if (key === 'Shift') { e.preventDefault(); handleInput('Shift'); return; }
        e.preventDefault();
        if (/^[A-Z]$/.test(key)) key = key.toLowerCase();
        if (!ALLOWED_PHYSICAL.has(key)) return;
        handleInput(key);
    });

    window.handleInput = handleInput; window.setOrder = setOrder; window.setBaseStyle = setBaseStyle; window.setFinalStyle = setFinalStyle;
    window.goToStart = goToStart; window.closeMessageAndNext = closeMessageAndNext; window.pullGacha = pullGacha;
    window.mixGacha = mixGacha; window.tryAdminAccess = tryAdminAccess; window.processAdminCommand = processAdminCommand;
    window.renderVerList = renderVerList;
</script>
</body>
