<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>すーぱーちぇっく(新)</title>
    <meta property="og:title" content="すーぱーちぇっく(新)" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="-すーぱーちぇっく-の練習として開発したものです。scratchのバージョン2です。" />
    <meta property="og:site_name" content="すーぱーちぇっく(新)" />
    
    <style>
        :root {
            --key-bg: #ffffff;
            --bg-color: #d1d4d9;
            --special-key-bg: #adb5bd;
            --active-bg: #a0a0a0;
            --shift-bg: #ffc107;
            --disabled-key-bg: #e8e8e8;
            --disabled-key-color: #bbb;

            --key-height: 48px;
            --key-font: 16px;
            --key-mb: 7px;
            --kbd-padding: 9px;
            --num-row-height: 40px;
            --num-row-font: 13px;
            /* 5 rows: num row + 4 alpha rows */
            --keyboard-total: calc(var(--num-row-height) + var(--key-height) * 4 + var(--key-mb) * 5 + var(--kbd-padding) * 2);
        }

        @media (max-height: 600px) {
            :root {
                --key-height: 34px;
                --key-font: 12px;
                --key-mb: 4px;
                --kbd-padding: 5px;
                --num-row-height: 30px;
                --num-row-font: 11px;
            }
        }
        @media (max-height: 700px) and (min-height: 601px) {
            :root {
                --key-height: 40px;
                --key-font: 14px;
                --key-mb: 5px;
                --kbd-padding: 7px;
                --num-row-height: 34px;
                --num-row-font: 12px;
            }
        }
        @media (max-width: 360px) {
            :root {
                --key-font: 11px;
                --num-row-font: 10px;
            }
        }

        * {
            touch-action: manipulation;
            box-sizing: border-box;
        }
        html, body {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
        }
        body {
            background-color: #f8f9fa;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
            padding: 16px; overflow-y: auto;
        }
        .active-screen { display: flex; }

        .menu-btn {
            padding: 15px 30px; margin: 8px; font-size: clamp(14px, 4vw, 18px);
            cursor: pointer; border: none; background: #007bff; color: white; border-radius: 8px;
            min-width: min(280px, 85vw); transition: 0.2s;
        }

        #admin-trigger {
            position: absolute; bottom: 20px; right: 20px;
            padding: 8px 15px; background: #6c757d; color: white;
            border-radius: 5px; cursor: pointer; font-size: 12px; border: none; opacity: 0.6;
        }
        #admin-screen {
            background: #1e1e1e; color: #00ff00; font-family: monospace;
            padding: 20px; box-sizing: border-box;
        }
        #admin-console {
            width: 95%; height: 60%; background: #000; color: #00ff00;
            padding: 10px; overflow-y: auto; border: 1px solid #333;
            margin-bottom: 10px; font-size: 14px; white-space: pre-wrap;
        }
        #admin-input {
            width: 95%; background: #000; color: #00ff00;
            border: 1px solid #00ff00; padding: 10px;
            font-family: monospace; outline: none;
        }

        #message-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; background: rgba(255,255,255,0.95);
            overflow-y: auto; padding: 10px 16px;
        }
        #message-content {
            font-size: clamp(32px, 10vw, 70px); font-weight: bold;
        }
        #message-sub {
            font-size: clamp(13px, 3.5vw, 22px);
            color: #333; margin: 8px 0; text-align: center; padding: 0 8px;
        }

        #gacha-result { text-align: center; margin-top: 8px; display: none; }
        #gacha-img {
            max-width: min(220px, 42vw); max-height: 22vh;
            width: auto; height: auto;
            border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #gacha-prob {
            margin-top: 6px; font-weight: bold; color: #666;
            font-size: clamp(11px, 3vw, 15px);
        }

        #game-container {
            position: fixed; top: 0; left: 0; width: 100%;
            height: calc(100% - var(--keyboard-total));
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 8px 16px; overflow-y: auto;
        }
        #mondai-display {
            font-size: clamp(14px, 4vw, 22px); margin-bottom: 12px; color: #555;
        }
        #answer-area {
            font-size: clamp(18px, 5vw, 28px); font-weight: bold;
            display: flex; flex-wrap: wrap;
            justify-content: center; gap: 8px; align-items: center;
        }
        .input-box {
            border-bottom: 3px solid #ccc;
            min-width: clamp(50px, 15vw, 80px);
            height: clamp(30px, 8vw, 40px);
            display: flex; align-items: center; justify-content: center;
            padding: 0 5px;
        }
        .input-box.active-box { border-bottom-color: #007bff; color: #007bff; }
        .cursor {
            width: 2px; height: clamp(18px, 5vw, 24px);
            background-color: #007bff; animation: blink 0.8s infinite; margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ===== KEYBOARD ===== */
        .keyboard {
            position: fixed; bottom: 0; width: 100%;
            background-color: var(--bg-color);
            padding: var(--kbd-padding) 0;
            display: none;
            padding-bottom: calc(var(--kbd-padding) + env(safe-area-inset-bottom, 0px));
        }
        .row {
            display: flex; justify-content: center; margin-bottom: var(--key-mb);
        }
        .row:last-child { margin-bottom: 0; }

        /* Normal keys */
        .key {
            flex: 1; margin: 0 2px;
            background-color: var(--key-bg);
            border: none; border-radius: 5px;
            font-size: var(--key-font);
            cursor: pointer;
            box-shadow: 0 3px 0 #999;
            transition: transform 0.08s, box-shadow 0.08s, background-color 0.1s;
            touch-action: manipulation;
            user-select: none; -webkit-user-select: none;
            min-width: 0; padding: 0 1px;
            color: #222;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 1px;
            height: var(--key-height);
        }
        /* Number row keys are shorter */
        .key-num {
            height: var(--num-row-height);
            font-size: var(--num-row-font);
        }
        .key.active {
            background-color: var(--active-bg) !important;
            box-shadow: 0 1px 0 #999;
            transform: translateY(2px);
        }
        .key.key-disabled {
            background-color: var(--disabled-key-bg);
            color: var(--disabled-key-color);
            cursor: not-allowed;
            box-shadow: 0 2px 0 #ccc;
            pointer-events: none;
        }
        .key-special { background-color: var(--special-key-bg); flex: 1.5; }
        .key-wide { flex: 2; }
        .key-space { flex: 4; }
        .key.shift-active {
            background-color: var(--shift-bg) !important;
            color: #222; font-weight: bold;
        }

        /* Sub-label: shows secondary character on key */
        .key-main { line-height: 1; }
        .key-sub {
            font-size: 0.6em; color: #888; line-height: 1;
        }
        .key.shift-active .key-sub { color: #555; }

        /* Number row: top label = shift value, bottom = normal subscript */
        .key-num .key-main { font-size: 1em; }
        .key-num .key-sub  { font-size: 0.65em; color: #999; }

        /* ===== ALL END ===== */
        #allend-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column;
            align-items: center; justify-content: flex-start;
            z-index: 60; background: white;
            padding: 24px 16px 32px; overflow-y: auto;
        }
        #allend-title {
            font-size: clamp(40px, 12vw, 80px);
            font-weight: bold; letter-spacing: 4px; color: #222; margin-top: 20px;
        }
        #allend-score { font-size: clamp(18px, 5vw, 32px); color: #555; margin: 16px 0; }
        #allend-back {
            padding: clamp(10px, 3vw, 15px) clamp(20px, 6vw, 40px);
            font-size: clamp(16px, 4vw, 20px);
            background: #007bff; color: white;
            border: none; border-radius: 8px; cursor: pointer; margin-top: 10px;
        }
        #wrong-list-section { width: 100%; max-width: 600px; margin-top: 24px; text-align: left; }
        #wrong-list-title {
            font-size: clamp(16px, 4.5vw, 22px); font-weight: bold; color: #c0392b;
            margin-bottom: 12px; border-left: 5px solid #c0392b; padding-left: 10px;
        }
        .wrong-item {
            background: #fff5f5; border: 1px solid #f5c6cb;
            border-radius: 8px; padding: 10px 14px; margin-bottom: 10px;
        }
        .wrong-item .wi-mondai { font-size: clamp(12px, 3.2vw, 15px); color: #777; margin-bottom: 4px; }
        .wrong-item .wi-answer { font-size: clamp(13px, 3.5vw, 17px); font-weight: bold; color: #222; }
        .wrong-item .wi-answer span {
            background: #ffe0e0; border-radius: 4px; padding: 1px 5px; color: #c0392b;
        }



        /* 変換候補パネル */
        #henkan-panel {
            position: fixed;
            bottom: var(--keyboard-total);
            left: 0; width: 100%;
            background: #fff;
            border-top: 2px solid #007bff;
            display: none;
            flex-wrap: wrap;
            z-index: 20;
            max-height: 44px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
        }
        .henkan-item {
            display: inline-block;
            padding: 8px 14px;
            font-size: 16px;
            cursor: pointer;
            border-right: 1px solid #ddd;
            flex-shrink: 0;
        }
        .henkan-item:active, .henkan-item.selected {
            background: #007bff;
            color: white;
        }
        /* 全角半角ボタン */
        .key.zenkaku-active {
            background-color: #28a745 !important;
            color: white; font-weight: bold;
        }
        /* Shift mode indicator banner */
        #shift-banner {
            position: fixed;
            top: calc(100% - var(--keyboard-total) - 28px);
            left: 0; width: 100%; text-align: center;
            font-size: 12px; font-weight: bold; letter-spacing: 1px;
            padding: 3px 0;
            transition: all 0.15s;
            z-index: 5;
            display: none;
            pointer-events: none;
        }
        #shift-banner.mode-normal {
            background: #e0e0e0;
            color: #555;
        }
        #shift-banner.mode-shift {
            background: var(--shift-bg);
            color: #333;
        }
    </style>
</head>
<body>

<div id="allend-overlay">
    <div id="allend-title">ALL END</div>
    <div id="allend-score"></div>
    <button id="allend-back" onclick="goToStart()">トップへ戻る</button>
    <div id="wrong-list-section" style="display:none;">

<div id="henkan-panel"></div>

<div id="game-container">

    <div id="answer-area"></div>
</div>

<!-- Shift mode banner -->
<div id="shift-banner" class="mode-normal">通常モード　A-Z / ₁-₉ / →</div>

<!--
    KEYBOARD LAYOUT

    NORMAL MODE (isShift = false):
      - A-Z (uppercase letters)
      - Number row: DISABLED for letter input; shows subscript hint (₁-₉)
      - →, Backspace, Enter, ;(+) always active

    SHIFT MODE (isShift = true):
      - a-z (lowercase letters)
      - Number row: ENABLED → inputs subscript digits ₁-₉  (wait, reversed per spec)
      ... 

    *** Per spec clarification ***:
      通常モード: 大文字A-Z + 下付き文字₁-₉ (subscript digits)
      Shiftモード: 小文字a-z + 通常数字1-9 (normal digits)
-->
<div class="keyboard" id="main-keyboard">
    <!-- Number row: normal=subscript(₁-₉ input), shift=normal digits(1-9) -->
    <div class="row" id="num-row">
        <button class="key key-num" id="num-1" data-key="1" onclick="handleInput('1')">

        <button class="key key-num" id="num-4" data-key="4" onclick="handleInput('4')">

        </button>
        <button class="key key-num" id="num-5" data-key="5" onclick="handleInput('5')">

        <button class="key key-num" id="num-9" data-key="9" onclick="handleInput('9')">
            <span class="key-main" id="nkd-9">₉</span>
        </button>
    </div>
    <!-- Row 1: Q-P -->
    <div class="row">
        <button class="key" data-key="q" onclick="handleInput('q')"><span class="key-main" id="kd-q">Q</span></button>
        <button class="key" data-key="w" onclick="handleInput('w')"><span class="key-main" id="kd-w">W</span></button>
        <button class="key" data-key="e" onclick="handleInput('e')"><span class="key-main" id="kd-e">E</span></button>
        <button class="key" data-key="r" onclick="handleInput('r')"><span class="key-main" id="kd-r">R</span></button>
        <button class="key" data-key="t" onclick="handleInput('t')"><span class="key-main" id="kd-t">T</span></button>
        <button class="key" data-key="y" onclick="handleInput('y')"><span class="key-main" id="kd-y">Y</span></button>
        <button class="key" data-key="u" onclick="handleInput('u')"><span class="key-main" id="kd-u">U</span></button>
        <button class="key" data-key="i" onclick="handleInput('i')"><span class="key-main" id="kd-i">I</span></button>
        <button class="key" data-key="o" onclick="handleInput('o')"><span class="key-main" id="kd-o">O</span></button>

    <div class="row">
        <button class="key" data-key="a" onclick="handleInput('a')"><span class="key-main" id="kd-a">A</span></button>
        <button class="key" data-key="s" onclick="handleInput('s')"><span class="key-main" id="kd-s">S</span></button>
        <button class="key" data-key="d" onclick="handleInput('d')"><span class="key-main" id="kd-d">D</span></button>
        <button class="key" data-key="f" onclick="handleInput('f')"><span class="key-main" id="kd-f">F</span></button>
        <button class="key" data-key="g" onclick="handleInput('g')"><span class="key-main" id="kd-g">G</span></button>
        <button class="key" data-key="h" onclick="handleInput('h')"><span class="key-main" id="kd-h">H</span></button>
        <button class="key" data-key="j" onclick="handleInput('j')"><span class="key-main" id="kd-j">J</span></button>
        <button class="key" data-key="k" onclick="handleInput('k')"><span class="key-main" id="kd-k">K</span></button>

        <button class="key key-wide" data-key=";" onclick="handleInput(';')">;</button>

        <button class="key key-special" data-key="Enter" onclick="handleInput('Enter')">Enter</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBThej0xTpO6eBOHhpXxaJHgPzpdekXvFM",
        authDomain: "genso-daa6d.firebaseapp.com",
        databaseURL: "https://genso-daa6d-default-rtdb.firebaseio.com",
        projectId: "genso-daa6d",
        storageBucket: "genso-daa6d.firebasestorage.app",
        messagingSenderId: "218450334268",
        appId: "1:218450334268:web:37590aa47de792b5c4e939",
        measurementId: "G-GP4NJH14VY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef   = ref(db, 'mondaiData');
    const rootRef = ref(db, '/');

    window.rawMondai = [];
    window.rawKotaeGroups = [];
    window.hani_end = [];
    window.kaitouran = [];
    window.adminPass = null;

    // ルート全体を監視: 問題データは mondaiData/, passはルート直下 or mondaiData/pass 両対応
    onValue(rootRef, (snapshot) => {
        const root = snapshot.val() || {};
        const data = root.mondaiData || {};
        window.rawMondai      = data.mondai    || [];
        window.rawKotaeGroups = data.kotae     || [];
        window.hani_end       = data.hani      || [];
        window.kaitouran      = data.kaitouran || [];
        // ルート直下の pass を優先、なければ mondaiData/pass
        if (root.pass !== undefined && root.pass !== null) {
            window.adminPass = root.pass;
        } else if (data.pass !== undefined && data.pass !== null) {
            window.adminPass = data.pass;
        } else {
            window.adminPass = null;
        }
        renderVerList();
    });

    window.saveToFirebase = function() {
        set(dbRef, {
            mondai:    window.rawMondai,
            kotae:     window.rawKotaeGroups,
            hani:      window.hani_end,
            kaitouran: window.kaitouran
        }).then(() => console.log("Cloud Updated!"));
    };
</script>

<script>
    // ===== State =====
    let playStyle = 'once', subStyle = 'gacha', playOrder = 'normal';
    let currentPool = [], currentPos = 0;

    function flashKey(key) {

    // ローマ字バッファを変換。変換できた文字を返し、残りをバッファに残す
    function tryConvertRoma(buf) {
        // っ: 子音が2つ続いた場合 (nn以外)
        if (buf.length >= 2 && buf[0] === buf[1] && buf[0] !== 'n') {
            return { out: 'っ', rest: buf.slice(1) };
        }
        // 長い順にマッチ試行
        for (const [roma, hira] of ROMA_TABLE) {
            if (buf.startsWith(roma)) {
                return { out: hira, rest: buf.slice(roma.length) };
            }
        }
        // バッファが長くなりすぎたら先頭を捨てる
        if (buf.length >= 4) {
            return { out: buf[0], rest: buf.slice(1) };
        }
        return null; // まだ確定できない
    }

    function flushRomaBuffer(forceFlush) {
        let result = '';
        // 'n' + 非母音/非nなら「ん」確定
        if (romaBuffer === 'n') {
            if (forceFlush) { result = 'ん'; romaBuffer = ''; }
        } else {
            const res = tryConvertRoma(romaBuffer);
            if (res) {
                result = res.out;
                romaBuffer = res.rest;
                // 再帰的に残りも変換
                if (romaBuffer.length > 0) {
                    const more = flushRomaBuffer(false);
                    result += more;
                }
            }
        }
        return result;
    }

    function inputRomaChar(c) {
        const letter = c.toLowerCase();
        const isVowel = 'aiueo'.includes(letter);

        // 'n' の特別処理: 次が母音でも'n'でもない子音なら「ん」確定
        if (romaBuffer === 'n' && letter !== 'n' && !isVowel) {
            inputs[activeInputIdx] += 'ん';
            romaBuffer = '';
        }

        romaBuffer += letter;

        // 変換を試みる
        let converted = '';
        while (romaBuffer.length > 0) {
            const res = tryConvertRoma(romaBuffer);
            if (res) {
                converted += res.out;
                romaBuffer = res.rest;
            } else {
                break;
            }
        }
        if (converted) inputs[activeInputIdx] += converted;
    }


    // ===== Google IME API による漢字変換 =====
    async function fetchHenkan(hiragana) {
        try {
            const url = `https://www.google.com/transliterate?langpair=ja-Hira|ja&text=${encodeURIComponent(hiragana + ',')}`;
            const res = await fetch(url);
            const json = await res.json();
            // json: [[original, [候補1, 候補2, ...]], ...]
            const candidates = [];
            json.forEach(seg => { if (seg[1]) seg[1].forEach(c => { if (!candidates.includes(c)) candidates.push(c); }); });
            return candidates.length > 0 ? candidates : [hiragana];
        } catch(e) {
            return [hiragana];
        }
    }

    function showHenkanPanel(candidates, base) {
        henkanMode = true;
        henkanList = candidates;
        henkanBase = base;
        henkanIdx  = 0;
        const panel = document.getElementById('henkan-panel');
        panel.innerHTML = '';
        candidates.forEach((c, i) => {
            const el = document.createElement('div');
            el.className = 'henkan-item' + (i === 0 ? ' selected' : '');
            el.textContent = c;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); selectHenkan(i); }, {passive: false});
            el.addEventListener('mousedown',  (e) => { e.preventDefault(); selectHenkan(i); });
            panel.appendChild(el);
        });
        panel.style.display = 'flex';
    }

    function selectHenkan(idx) {
        const chosen = henkanList[idx];
        // 入力末尾のhenkanBaseをchosenに置換
        const cur = inputs[activeInputIdx];
        if (cur.endsWith(henkanBase)) {
            inputs[activeInputIdx] = cur.slice(0, cur.length - henkanBase.length) + chosen;
        } else {
            inputs[activeInputIdx] += chosen;
        }
        closeHenkanPanel();
        updateDisplay();
    }

    function closeHenkanPanel() {
        henkanMode = false;
        henkanList = [];
        henkanBase = '';
        henkanIdx  = 0;
        const panel = document.getElementById('henkan-panel');
        panel.style.display = 'none';
        panel.innerHTML = '';
    }

    // 変換対象: 入力末尾のひらがな列を取得
    function getTrailingHiragana(str) {
        const m = str.match(/[\u3041-\u3096ー]+$/);
        return m ? m[0] : '';
    }

    // ===== Input handler =====
    function handleInput(key) {
        if (isWaiting) return;
        if (document.getElementById('admin-screen').classList.contains('active-screen')) return;
        if (document.getElementById('game-container').style.display !== 'flex') return;

        if (key === 'Shift') {
            isShift = !isShift;
            updateKeyboardDisplay();
            return;
        }

        if (key === 'Zenkaku') {
            isZenkaku = !isZenkaku;
            romaBuffer = '';
            const zk = document.getElementById('zenkaku-key');
            if (zk) {
                zk.textContent = isZenkaku ? 'かな' : '全角';
                isZenkaku ? zk.classList.add('zenkaku-active') : zk.classList.remove('zenkaku-active');
            }
            updateKeyboardDisplay();
            return;
        }

        flashKey(key);

        if (key === 'Backspace') {
            // 変換候補表示中はパネルを閉じる
            if (henkanMode) { closeHenkanPanel(); updateDisplay(); return; }
            // バッファに文字があればバッファを消す
            if (isZenkaku && romaBuffer.length > 0) {
                romaBuffer = romaBuffer.slice(0, -1);
            } else if (inputs[activeInputIdx] === '') {
                if (activeInputIdx > 0) activeInputIdx--;
            } else {
                inputs[activeInputIdx] = inputs[activeInputIdx].slice(0, -1);
            }
        } else if (key === 'Enter') {
            // 変換候補が出ているなら確定
            if (henkanMode) {
                selectHenkan(henkanIdx);
                return;
            }
            // Enterでバッファを強制フラッシュ
            if (isZenkaku && romaBuffer.length > 0) {
                const flushed = flushRomaBuffer(true);
                if (flushed) inputs[activeInputIdx] += flushed;
                romaBuffer = '';
            }
            if (inputs.length > 1 && activeInputIdx < inputs.length - 1) {
                activeInputIdx++;
            } else {
                checkAnswer();
            }
        } else if (key === ' ') {
            if (isZenkaku) {
                // バッファ残りをフラッシュ
                if (romaBuffer.length > 0) {
                    const flushed = flushRomaBuffer(true);
                    if (flushed) inputs[activeInputIdx] += flushed;
                    romaBuffer = '';
                    updateDisplay();
                }
                if (henkanMode) {
                    // 変換中: 次の候補へ
                    henkanIdx = (henkanIdx + 1) % henkanList.length;
                    document.querySelectorAll('.henkan-item').forEach((el, i) => {
                        el.classList.toggle('selected', i === henkanIdx);
                    });
                    // 選択ハイライトのみ、確定はしない（タップかEnterで確定）
                } else {
                    // 末尾ひらがなを取得してGoogle変換
                    const hira = getTrailingHiragana(inputs[activeInputIdx]);
                    if (hira.length > 0) {
                        fetchHenkan(hira).then(candidates => {
                            showHenkanPanel(candidates, hira);
                            updateDisplay();
                        });
                    }
                }
                return; // updateDisplayは非同期内で
            }
            inputs[activeInputIdx] += ' ';
            if (activeInputIdx < inputs.length - 1) activeInputIdx++;
        } else if (key === 'ArrowRight') {
            if (isZenkaku && romaBuffer.length > 0) {
                const flushed = flushRomaBuffer(true);
                if (flushed) inputs[activeInputIdx] += flushed;
                romaBuffer = '';
            }
            inputs[activeInputIdx] += '→';
        } else if (key === ';') {
            inputs[activeInputIdx] += '+';
        } else if (/^[1-9]$/.test(key)) {
            const n = parseInt(key) - 1;
            if (isShift) {
                inputs[activeInputIdx] += NRM_DIGITS[n];
            } else {
                inputs[activeInputIdx] += SUB_DIGITS[n];
            }
        } else if (/^[a-zA-Z]$/.test(key)) {
            if (isZenkaku) {
                // ローマ字モード: 常に小文字として処理
                inputRomaChar(key.toLowerCase());
            } else {
                // 通常/Shiftモード
                inputs[activeInputIdx] += isShift ? key.toLowerCase() : key.toUpperCase();
            }
        } else {
            return;
        }

        updateDisplay();
    }

    // ===== Render =====
    function renderVerList() {
        const listEl = document.getElementById('ver-list');
        if (!listEl) return;
        listEl.innerHTML = '';
        window.hani_end.forEach((val, i) => {
            const btn = document.createElement('button');
            btn.className = 'menu-btn';
            btn.innerText = `Ver ${i + 1}.0`;
            btn.onclick = () => {
                const start = i === 0 ? 0 : window.hani_end[i-1] + 1;
                currentPool = Array.from({length: val - start + 1}, (_, k) => k + start);
                showScreen('order-screen');
            };
            listEl.appendChild(btn);
        });
    }

    function setOrder(o) { playOrder = o; showScreen('style-screen'); }
    function setBaseStyle(s) { playStyle = s; showScreen('substyle-screen'); }
    function setFinalStyle(s) {
        subStyle = s; correctCount = 0; startGame();
    }

    function startGame() {
        currentPos = 0; correctCount = 0; totalQuestions = 0;
        retryPool = []; wrongAnswers = [];
        if (playOrder === 'random') currentPool.sort(() => Math.random() - 0.5);
        totalQuestions = currentPool.length;
        showScreen('');
        document.getElementById('game-container').style.display = 'flex';
        document.getElementById('main-keyboard').style.display = 'block';
        document.getElementById('shift-banner').style.display = 'block';
        isShift = false;
        isZenkaku = false;
        romaBuffer = '';
        closeHenkanPanel();
        const zk = document.getElementById('zenkaku-key');
        if (zk) { zk.textContent = '全角'; zk.classList.remove('zenkaku-active'); }
        updateKeyboardDisplay();
        loadQuestion();
    }

    function loadQuestion() {
        const idx = currentPool[currentPos];
        document.getElementById('mondai-display').innerText = window.rawMondai[idx] || '';

        const template = window.kaitouran[idx] || '';
        const ans = window.rawKotaeGroups[idx] || [];
        const area = document.getElementById('answer-area');
        area.innerHTML = '';

        const parts = template.split('()');
        inputs = new Array(parts.length - 1).fill('');
        activeInputIdx = 0;

        parts.forEach((pt, i) => {
            if (pt !== '') {
                const span = document.createElement('span');
                span.innerText = pt;
                area.appendChild(span);
            }
            if (i < parts.length - 1) {
                const b = document.createElement('div');
                b.className = 'input-box';
                b.id = `box-${i}`;
                const ansLen = (ans[i] || '').length;
                if (ansLen > 0) b.style.minWidth = Math.max(50, ansLen * 14) + 'px';
                area.appendChild(b);
            }
        });

        updateDisplay();
    }

    function updateDisplay() {
        inputs.forEach((v, i) => {
            const b = document.getElementById(`box-${i}`);
            if (!b) return;
            b.classList.remove('active-box');
            b.innerHTML = '';
            if (i === activeInputIdx) {
                b.classList.add('active-box');
                b.style.color = '#007bff';
                // 確定済みテキスト
                const confirmed = document.createElement('span');
                confirmed.textContent = v.replace(/ /g, ' ');
                b.appendChild(confirmed);
                // 未確定ローマ字バッファ（下線付き）
                if (isZenkaku && romaBuffer.length > 0) {
                    const pending = document.createElement('span');
                    pending.textContent = romaBuffer;
                    pending.style.cssText = 'text-decoration: underline; color: #0056b3; font-style: italic;';
                    b.appendChild(pending);
                }
                const c = document.createElement('span');
                c.className = 'cursor';
                b.appendChild(c);
            } else {
                b.innerText = (v || '').replace(/ /g, ' ');
                b.style.color = v ? '#333' : '#ccc';
            }
        });
    }

    function checkAnswer() {
        const idx = currentPool[currentPos];
        const ans = window.rawKotaeGroups[idx] || [];
        const template = window.kaitouran[idx] || '';

        const ok = inputs.every((v, i) => v.trim() === (ans[i] || ''));

        const parts = template.split('()');
        let correctSentence = '';
        parts.forEach((pt, i) => {
            correctSentence += pt;
            if (i < parts.length - 1) correctSentence += `(${ans[i] || ''})`;
        });

        if (ok) {
            if (subStyle === 'gacha') {
                correctCount++;
                if (correctCount >= 4) {
                    correctCount = 0;
                    showMsg('正解！', 'green', null, '4回正解達成！おめでと！', true);
                    return;
                }
            }
            showMsg('正解', 'green', () => next());
        } else {
            if (playStyle === 'retry') retryPool.push(idx);
            const mondaiText = window.rawMondai[idx] || '';
            wrongAnswers.push({ mondai: mondaiText, answer: correctSentence });
            showMsg('不正解', 'red', null, `正解: ${correctSentence}`);
        }
    }

    function showMsg(m, c, cb, sub = '', gachaReady = false) {
        isWaiting = true;
        const o = document.getElementById('message-overlay');
        document.getElementById('message-content').innerText = m;
        document.getElementById('message-content').style.color = c;
        document.getElementById('message-sub').innerText = sub;
        document.getElementById('gacha-result').style.display = 'none';

        const gBtn = document.getElementById('gacha-btn');
        const nBtn = document.getElementById('next-btn-manual');
        const mBtn = document.getElementById('mix-btn');

        if (gachaReady) {
            gBtn.style.display = 'block'; mBtn.style.display = 'block'; nBtn.style.display = 'none';
        } else {
            gBtn.style.display = 'none'; mBtn.style.display = 'none';
            nBtn.style.display = cb ? 'none' : 'block';
        }

        o.style.display = 'flex';
        if (cb) setTimeout(() => { o.style.display = 'none'; isWaiting = false; cb(); }, 1000);
    }

    function pullGacha() {
        const rand = Math.random() * 100;
        let sum = 0, selected = GACHA_TABLE[0];
        for (const item of GACHA_TABLE) {
            sum += item.prob;
            if (rand < sum) { selected = item; break; }
        }
        document.getElementById('gacha-btn').style.display = 'none';
        document.getElementById('mix-btn').style.display = 'none';
        const res = document.getElementById('gacha-result');
        document.getElementById('gacha-img').src = selected.src;
        document.getElementById('gacha-prob').innerText = `出現確率: ${selected.prob}%`;
        res.style.display = 'block';
        document.getElementById('next-btn-manual').style.display = 'block';
    }

    function mixGacha() {
        document.getElementById('gacha-btn').style.display = 'none';
        document.getElementById('mix-btn').style.display = 'none';
        setTimeout(() => {
            document.getElementById('gacha-btn').style.display = 'block';
            document.getElementById('mix-btn').style.display = 'block';
        }, 300);
    }

    function next() {
        currentPos++;
        if (currentPos >= currentPool.length) {
            if (playStyle === 'retry' && retryPool.length > 0) {
                currentPool = [...retryPool]; retryPool = [];
                if (playOrder === 'random') currentPool.sort(() => Math.random() - 0.5);
                currentPos = 0; loadQuestion();
            } else {
                showAllEnd();
            }
        } else {
            loadQuestion();
        }
    }

    function showAllEnd() {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('main-keyboard').style.display = 'none';
        document.getElementById('shift-banner').style.display = 'none';

        const scoreEl = document.getElementById('allend-score');
        if (playStyle === 'once') {
            scoreEl.innerText = `${totalQuestions - wrongAnswers.length} / ${totalQuestions} 問正解`;
        } else {
            scoreEl.innerText = '全問正解！';
        }

        const section = document.getElementById('wrong-list-section');
        const listEl = document.getElementById('wrong-list');
        listEl.innerHTML = '';
        if (wrongAnswers.length > 0) {
            section.style.display = 'block';
            wrongAnswers.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'wrong-item';
                const highlighted = item.answer.replace(/\(([^)]*)\)/g, '(<span>$1</span>)');
                div.innerHTML = `
                    <div class="wi-mondai">Q${i+1}. ${item.mondai}</div>
                    <div class="wi-answer">正解: ${highlighted}</div>`;
                listEl.appendChild(div);
            });
        } else {
            section.style.display = 'none';
        }
        document.getElementById('allend-overlay').style.display = 'flex';
    }

    function goToStart() {
        document.getElementById('allend-overlay').style.display = 'none';
        showScreen('start-screen');
    }

    function closeMessageAndNext() {
        document.getElementById('message-overlay').style.display = 'none';
        isWaiting = false;
        next();
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('main-keyboard').style.display = 'none';
        document.getElementById('shift-banner').style.display = 'none';
        if (id) document.getElementById(id).classList.add('active-screen');
    }

    function tryAdminAccess() {
        const entered = prompt('Pass?');
        if (entered === null) return; // キャンセル
        const stored = String(window.adminPass ?? '');
        if (entered === stored) {
            showScreen('admin-screen');
        } else {
            alert(`NG（DB値: "${stored}"）`);
        }
    }

    // ===== Admin Console =====
    function logAdmin(t) {
        const c = document.getElementById('admin-console');
        c.innerText += t + '\n';
        c.scrollTop = c.scrollHeight;
    }
    function getListByName(name) {
        if (name === 'mondai')    return window.rawMondai;
        if (name === 'kotae')     return window.rawKotaeGroups;
        if (name === 'hani')      return window.hani_end;
        if (name === 'kaitouran') return window.kaitouran;
        return null;
    }
    function processAdminCommand(e) {
        if (e.key !== 'Enter') return;
        const input = document.getElementById('admin-input');
        const full = input.value.trim();
        input.value = '';
        if (!full) return;
        logAdmin('> ' + full);
        const p = full.match(/(".*?"|[^"\s]+)/g)?.map(x => x.replace(/"/g, '')) || [];
        const cmd = p[0]?.toLowerCase();

        if (cmd === 'exit') showScreen('start-screen');
        else if (cmd === 'setpass') {
            const newPass = p[1];
            if (!newPass) return logAdmin('Usage: setpass <新しいパスワード>');
            window.adminPass = newPass;
            window.saveToFirebase();
            logAdmin(`パスワードを「${newPass}」に更新しました。`);
        }
        else if (cmd === 'show') {
            const listName = p[1]?.toLowerCase();
            if (listName === 'all') logAdmin(`Sizes: mondai:${window.rawMondai.length}, kotae:${window.rawKotaeGroups.length}, hani:${window.hani_end.length}, kaitouran:${window.kaitouran.length}`);
            else {
                const list = getListByName(listName);
                if (list) list.forEach((v, i) => logAdmin(`[${i}] ${Array.isArray(v)?v.join(','):v}`));
                else logAdmin('Lists: mondai, kotae, hani, kaitouran');
            }
        }
        else if (cmd === 'add') {
            const listName = p[2]?.toLowerCase();
            if (listName === 'all') {
                const mondaiData = p[3], kotaeData = p[4] ? p[4].split(',') : [], kaitouranData = p[5];
                if (!mondaiData || !kotaeData.length || !kaitouranData) return logAdmin('Usage: add <idx/f> all <mondai> <kotae> <kaitouran>');
                const idxM = p[1]==='f' ? window.rawMondai.length : parseInt(p[1]);
                window.rawMondai.splice(idxM, 0, mondaiData);
                window.rawKotaeGroups.splice(idxM, 0, kotaeData);
                window.kaitouran.splice(idxM, 0, kaitouranData);
                logAdmin(`Added all [${idxM}]`);
                window.saveToFirebase();
            } else {
                const list = getListByName(listName);
                if (!list) return logAdmin('Error: List not found.');
                const idx = p[1]==='f' ? list.length : parseInt(p[1]);
                if (isNaN(idx)||idx<0) return logAdmin('Error: Invalid index.');
                let data = p[3];
                if (listName==='kotae') data = data.split(',');
                if (listName==='hani')  data = parseInt(data);
                list.splice(idx, 0, data);
                logAdmin(`Added to ${listName} at [${idx}]`);
                window.saveToFirebase();
            }
        }
        else if (cmd === 'replace') {
            const listName = p[2]?.toLowerCase();
            if (listName === 'all') {
                const mondaiData = p[3], kotaeData = p[4]?p[4].split(','):[], kaitouranData = p[5];
                if (!mondaiData||!kotaeData.length||!kaitouranData) return logAdmin('Usage: replace <idx/f> all <mondai> <kotae> <kaitouran>');
                const idxM = p[1]==='f' ? window.rawMondai.length-1 : parseInt(p[1]);
                if (isNaN(idxM)||idxM<0||idxM>=window.rawMondai.length) return logAdmin('Error: Invalid index.');
                window.rawMondai[idxM] = mondaiData;
                window.rawKotaeGroups[idxM] = kotaeData;
                window.kaitouran[idxM] = kaitouranData;
                logAdmin(`Replaced all [${idxM}]`);
                window.saveToFirebase();
            } else {
                const list = getListByName(listName);
                if (!list) return logAdmin('Error: List not found.');
                const idx = p[1]==='f' ? list.length-1 : parseInt(p[1]);
                if (isNaN(idx)||idx<0||idx>=list.length) return logAdmin('Error: Invalid index.');
                let data = p[3];
                if (listName==='kotae') data = data.split(',');
                if (listName==='hani')  data = parseInt(data);
                list[idx] = data;
                logAdmin(`Replaced ${listName} [${idx}]`);
                window.saveToFirebase();
            }
        }
        else if (cmd === 'remove') {
            const listName = p[2]?.toLowerCase();
            if (listName === 'all') {
                const idxM = p[1]==='f' ? window.rawMondai.length-1 : parseInt(p[1]);
                if (isNaN(idxM)||idxM<0||idxM>=window.rawMondai.length) return logAdmin('Error: Invalid index.');
                window.rawMondai.splice(idxM,1);
                window.rawKotaeGroups.splice(idxM,1);
                window.kaitouran.splice(idxM,1);
                logAdmin(`Removed all [${idxM}]`);
                window.saveToFirebase();
            } else {
                const list = getListByName(listName);
                if (!list||list.length===0) return logAdmin('Error: List empty or not found.');
                const idx = p[1]==='f' ? list.length-1 : parseInt(p[1]);
                if (isNaN(idx)||idx<0||idx>=list.length) return logAdmin('Error: Invalid index.');
                list.splice(idx,1);
                logAdmin(`Removed from ${listName} [${idx}]`);
                window.saveToFirebase();
            }
        }
        else {
            logAdmin(`Unknown command: ${cmd}`);
            logAdmin('Commands: exit, setpass, show, add, replace, remove');
        }
    }

    // ===== Physical keyboard support =====
    //
    // 通常モード (isShift=false):
    //   A-Z → uppercase letters
    //   1-9 → subscript digits ₁-₉
    //   Shift → toggle to Shiftモード
    //
    // Shiftモード (isShift=true):
    //   a-z → lowercase letters
    //   1-9 → normal digits 1-9
    //   Shift → toggle to 通常モード
    //
    // Both modes: ArrowRight→, Backspace, Enter, ;(+), Space

    const ALLOWED_PHYSICAL = new Set([
        'a','b','c','d','e','f','g','h','i','j','k','l','m',
        'n','o','p','q','r','s','t','u','v','w','x','y','z',
        '1','2','3','4','5','6','7','8','9',
        'Enter', 'Backspace', 'Shift', 'ArrowRight', ';', ' '
    ]);

    window.addEventListener('keydown', (e) => {
        if (document.activeElement.id === 'admin-input') return;

        let key = e.key;

        // 全角半角キー (物理キーボード)
        if (key === 'Zenkaku' || key === 'Hankaku' || key === 'ZenkakuHankaku' || key === 'KanaMode') {
            e.preventDefault();
            handleInput('Zenkaku');
            return;
        }

        if (key === 'Shift') { e.preventDefault(); handleInput('Shift'); return; }

        e.preventDefault();

        // Normalise letter to lowercase
        if (/^[A-Z]$/.test(key)) key = key.toLowerCase();

        if (!ALLOWED_PHYSICAL.has(key)) return;
        handleInput(key);
    });

    // Expose globals for inline onclick handlers
    window.handleInput          = handleInput;
    window.setOrder             = setOrder;
    window.setBaseStyle         = setBaseStyle;
    window.setFinalStyle        = setFinalStyle;
    window.goToStart            = goToStart;
    window.closeMessageAndNext  = closeMessageAndNext;
    window.pullGacha            = pullGacha;
    window.mixGacha             = mixGacha;
    window.tryAdminAccess       = tryAdminAccess;
    window.processAdminCommand  = processAdminCommand;
    window.renderVerList        = renderVerList;
</script>
</body>
